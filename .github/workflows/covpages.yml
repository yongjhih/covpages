name: Test Coverage Pages

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Run Tests
        run: |
          npm ci
          npm run test:coverage || npm test

      - name: Restore Previous Coverage History
        uses: actions/cache/restore@v4
        with:
          path: covpages-dist/history.json
          key: covpages-history-${{ github.ref_name }}
          restore-keys: |
            covpages-history-

      - name: Generate covpages with History
        run: |
          npx covpages generate \
            --output covpages-dist \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --message "${{ github.event.head_commit.message }}" \
            coverage/lcov.info

      - name: Save Coverage History Cache
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: covpages-dist/history.json
          key: covpages-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Deploy to gh-pages Branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./covpages-dist
          force_orphan: true

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'covpages-dist'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4
