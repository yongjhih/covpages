name: Test Coverage Pages (Docs)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "covpages-docs"
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build covpages
        run: npm run build

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Seed docs/ from main (tag builds)
        if: github.ref_type == 'tag'
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}
          git checkout origin/${{ github.event.repository.default_branch }} -- docs

      - name: Generate Self-Hosted covpages Report for docs
        run: |
          node bin/covpages.js generate \
            --input coverage/lcov.info \
            --output docs \
            --commit "${{ github.sha }}" \
            ${{ github.ref_type == 'branch' && format('--branch "{0}"', github.ref_name) || '' }} \
            ${{ github.ref_type == 'tag' && format('--tag "{0}"', github.ref_name) || '' }} \
            --message "${{ github.event.head_commit.message || 'Update coverage report' }}" \
            --repo "yongjhih/covpages" \
            --title "covpages Coverage" \
            --save-raw
          mkdir -p docs/covpages
          cp docs/index.html docs/covpages/index.html
          cp docs/badge.svg docs/covpages/badge.svg
          cp docs/history.json docs/refs.json docs/lcov.info docs/HEAD docs/covpages/ 2>/dev/null || true
          rm -rf docs/covpages/history docs/covpages/objects docs/covpages/refs
          cp -r docs/objects docs/refs docs/covpages/ 2>/dev/null || true
          cp -r docs/badges docs/covpages/ 2>/dev/null || true
          node bin/build-website.js docs

      - name: Commit and Push Coverage to main /docs
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref_type == 'tag'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Detached at the tag: commit docs onto main through a worktree
            git worktree add /tmp/covpages-main origin/${{ github.event.repository.default_branch }}
            rsync -a --delete docs/ /tmp/covpages-main/docs/
            cd /tmp/covpages-main
          fi
          git add docs
          git diff --staged --quiet || git commit -m "docs(coverage): update self-hosted coverage report and badge [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Deploy to gh-pages Branch as Secondary Target
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: false
