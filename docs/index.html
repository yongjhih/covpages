<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unit test coverage report with multi-commit trends powered by covpages">
  <meta name="color-scheme" content="light dark">
  <title>covpages Coverage - covpages</title>
  <style>

/* Primer-inspired GitHub theme design tokens */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #656d76;
  --color-fg-subtle: #6e7781;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: #ddf4ff;
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: #dafbe1;
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: #ffebe9;
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #bf8700;
  --color-attention-subtle: #fff8c5;
  --color-neutral-subtle: rgba(234, 238, 242, 0.5);

  --chart-grid: #eaeef2;
  --chart-line: #0969da;
  --chart-fill: rgba(9, 105, 218, 0.08);

  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --shadow-sm: 0 1px 0 rgba(27, 31, 36, 0.04);
  --shadow-rest: 0 1px 3px rgba(31, 35, 40, 0.12), 0 1px 2px rgba(31, 35, 40, 0.14);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-canvas-default: #0d1117;
    --color-canvas-subtle: #161b22;
    --color-canvas-inset: #010409;
    --color-border-default: #30363d;
    --color-border-muted: #21262d;
    --color-fg-default: #e6edf3;
    --color-fg-muted: #848d97;
    --color-fg-subtle: #6e7681;
    --color-accent-fg: #2f81f7;
    --color-accent-emphasis: #1f6feb;
    --color-accent-subtle: rgba(56, 139, 253, 0.15);
    --color-success-fg: #3fb950;
    --color-success-emphasis: #238636;
    --color-success-subtle: rgba(46, 160, 67, 0.15);
    --color-danger-fg: #f85149;
    --color-danger-emphasis: #da3633;
    --color-danger-subtle: rgba(248, 81, 73, 0.15);
    --color-attention-fg: #d29922;
    --color-attention-emphasis: #9e6a03;
    --color-attention-subtle: rgba(187, 128, 9, 0.15);
    --color-neutral-subtle: rgba(110, 118, 129, 0.1);

    --chart-grid: #21262d;
    --chart-line: #2f81f7;
    --chart-fill: rgba(47, 129, 247, 0.12);
  }
}

:root[data-theme="dark"] {
  --color-canvas-default: #0d1117;
  --color-canvas-subtle: #161b22;
  --color-canvas-inset: #010409;
  --color-border-default: #30363d;
  --color-border-muted: #21262d;
  --color-fg-default: #e6edf3;
  --color-fg-muted: #848d97;
  --color-fg-subtle: #6e7681;
  --color-accent-fg: #2f81f7;
  --color-accent-emphasis: #1f6feb;
  --color-accent-subtle: rgba(56, 139, 253, 0.15);
  --color-success-fg: #3fb950;
  --color-success-emphasis: #238636;
  --color-success-subtle: rgba(46, 160, 67, 0.15);
  --color-danger-fg: #f85149;
  --color-danger-emphasis: #da3633;
  --color-danger-subtle: rgba(248, 81, 73, 0.15);
  --color-attention-fg: #d29922;
  --color-attention-emphasis: #9e6a03;
  --color-attention-subtle: rgba(187, 128, 9, 0.15);
  --color-neutral-subtle: rgba(110, 118, 129, 0.1);

  --chart-grid: #21262d;
  --chart-line: #2f81f7;
  --chart-fill: rgba(47, 129, 247, 0.12);
}

:root[data-theme="light"] {
  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #656d76;
  --color-fg-subtle: #6e7781;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: #ddf4ff;
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: #dafbe1;
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: #ffebe9;
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #bf8700;
  --color-attention-subtle: #fff8c5;
  --color-neutral-subtle: rgba(234, 238, 242, 0.5);

  --chart-grid: #eaeef2;
  --chart-line: #0969da;
  --chart-fill: rgba(9, 105, 218, 0.08);
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header bar */
.gh-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 12px 24px;
}

.gh-header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.gh-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--color-fg-default);
  font-weight: 600;
  font-size: 16px;
}

.gh-brand-icon {
  display: flex;
  align-items: center;
  color: var(--color-fg-default);
}

.gh-repo-title {
  color: var(--color-accent-fg);
  font-weight: 600;
}

.gh-header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* GitHub Buttons & Selectors */
.gh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  line-height: 20px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
  text-decoration: none;
  transition: 80ms cubic-bezier(0.33, 1, 0.68, 1);
  box-shadow: var(--shadow-sm);
  user-select: none;
}

.gh-btn:hover {
  background-color: var(--color-border-muted);
}

.gh-btn:active {
  background-color: var(--color-border-default);
}

.gh-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
  outline-offset: -1px;
}

.gh-btn-primary {
  color: #ffffff;
  background-color: var(--color-success-emphasis);
  border-color: rgba(27, 31, 36, 0.15);
}

.gh-btn-primary:hover {
  background-color: #2c974b;
}

/* Ref (Branch/Tag) Selector Popover */
.ref-selector-wrap {
  position: relative;
}

.ref-selector-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.ref-btn-label {
  font-weight: 600;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dropdown-caret {
  font-size: 11px;
  margin-left: 2px;
  color: var(--color-fg-muted);
}

.ref-popover {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: 300px;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-rest);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.ref-popover-header {
  padding: 8px 10px;
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
}

.ref-popover-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.ref-popover-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-default);
}

.ref-popover-close {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  font-size: 13px;
  color: var(--color-fg-muted);
  border-radius: var(--radius-sm);
}

.ref-popover-close:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.ref-search-wrap {
  margin-bottom: 8px;
}

.ref-search-input {
  width: 100%;
  padding: 5px 8px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-sm);
  outline: none;
}

.ref-search-input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.ref-search-input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.ref-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--color-border-muted);
  margin-top: 4px;
}

.ref-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--color-fg-muted);
  cursor: pointer;
  margin-bottom: -1px;
}

.ref-tab:hover {
  color: var(--color-fg-default);
}

.ref-tab.active {
  color: var(--color-fg-default);
  border-bottom-color: #fd8c73;
  font-weight: 600;
}

.ref-list {
  max-height: 250px;
  overflow-y: auto;
  padding: 4px 0;
}

.ref-item {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--color-fg-default);
  cursor: pointer;
  gap: 8px;
  text-decoration: none;
}

.ref-item:hover, .ref-item.active {
  background-color: var(--color-canvas-subtle);
}

.ref-item.selected {
  font-weight: 600;
}

.ref-item-check {
  width: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-fg-default);
  flex-shrink: 0;
}

.ref-item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ref-item-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 10px;
  margin-left: auto;
}

.ref-empty {
  padding: 16px 12px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 12px;
}

/* Tabs */
.gh-nav-tabs {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 0 24px;
}

.gh-nav-tabs-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.gh-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--color-fg-muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}

.gh-tab:hover {
  color: var(--color-fg-default);
}

.gh-tab.active {
  color: var(--color-fg-default);
  font-weight: 600;
  border-bottom-color: #fd8c73;
}

.gh-tab .counter {
  display: inline-block;
  padding: 0 6px;
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
  border-radius: 20px;
}

/* Main Container */
.gh-container {
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  flex: 1;
}

/* Metric Cards */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.metric-card {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.metric-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.metric-value-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}

.metric-percent {
  font-size: 28px;
  font-weight: 600;
  line-height: 1.1;
  font-family: var(--font-sans);
}

.metric-counts {
  font-size: 13px;
  color: var(--color-fg-muted);
}

/* Progress bar */
.progress-bar-container {
  height: 6px;
  background-color: var(--color-border-muted);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 3px;
}

/* Delta badges */
.delta-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 12px;
  line-height: 14px;
}

.delta-badge.positive {
  color: var(--color-success-fg);
  background-color: var(--color-success-subtle);
}

.delta-badge.negative {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

.delta-badge.neutral {
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
}

/* GitHub Commit Banner */
.commit-banner {
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.commit-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.commit-author-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background-color: var(--color-accent-emphasis);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}

.commit-message {
  font-weight: 600;
  color: var(--color-fg-default);
}

.commit-meta {
  color: var(--color-fg-muted);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.commit-sha-badge {
  font-family: var(--font-mono);
  font-size: 12px;
  background-color: var(--color-neutral-subtle);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--color-accent-fg);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Toolbar & Breadcrumbs */
.file-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 12px;
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--color-fg-muted);
  flex-wrap: wrap;
}

.breadcrumb-item {
  color: var(--color-accent-fg);
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
}

.breadcrumb-item:hover {
  text-decoration: underline;
}

.breadcrumb-separator {
  color: var(--color-fg-muted);
}

.search-box {
  position: relative;
  min-width: 220px;
}

.search-box input {
  width: 100%;
  padding: 5px 10px 5px 30px;
  font-size: 13px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  outline: none;
}

.search-box input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.search-box input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}

.search-icon {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  pointer-events: none;
  z-index: 1;
}

/* File Table */
.gh-box {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.table-wrapper {
  overflow-x: auto;
  max-inline-size: 100%;
}

table.gh-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}

table.gh-table th {
  background-color: var(--color-canvas-subtle);
  color: var(--color-fg-muted);
  font-weight: 600;
  padding: 8px 16px;
  border-bottom: 1px solid var(--color-border-default);
  white-space: nowrap;
  user-select: none;
}

table.gh-table th.sortable {
  cursor: pointer;
}

table.gh-table th.sortable:hover {
  color: var(--color-fg-default);
}

table.gh-table td {
  padding: 8px 16px;
  border-top: 1px solid var(--color-border-muted);
  color: var(--color-fg-default);
  vertical-align: middle;
}

table.gh-table tbody tr:first-child td {
  border-top: none;
}

table.gh-table tbody tr:hover td {
  background-color: var(--color-canvas-subtle);
}

.file-name-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}

.file-link {
  color: var(--color-fg-default);
  text-decoration: none;
  cursor: pointer;
}

.file-link:hover {
  color: var(--color-accent-fg);
  text-decoration: underline;
}

/* Rate Pill */
.rate-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  min-width: 52px;
}

.rate-high {
  color: var(--color-success-fg);
  background-color: var(--color-success-subtle);
}

.rate-medium {
  color: var(--color-attention-fg);
  background-color: var(--color-attention-subtle);
}

.rate-low {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

/* Charts */
.chart-container {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 24px;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}

.chart-title {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.chart-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.svg-chart {
  width: 100%;
  height: 240px;
  overflow: visible;
}

.chart-dot {
  cursor: pointer;
  transition: r 0.2s ease, fill 0.2s ease;
}

.chart-dot:hover {
  r: 6;
  fill: var(--color-accent-fg);
}

/* Tooltip */
.chart-tooltip {
  position: absolute;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  box-shadow: var(--shadow-rest);
  font-size: 12px;
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.15s ease;
  white-space: nowrap;
}

/* Code Viewer */
.blob-wrapper {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.blob-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  color: var(--color-fg-muted);
}

.blob-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.code-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 20px;
}

.code-table td {
  padding: 0 8px;
}

.code-table tr:hover {
  filter: brightness(0.96);
}

.blob-num {
  width: 1%;
  min-width: 48px;
  text-align: right;
  color: var(--color-fg-subtle);
  user-select: none;
  cursor: pointer;
  border-right: 1px solid var(--color-border-muted);
}

.blob-hits {
  width: 1%;
  min-width: 36px;
  text-align: right;
  color: var(--color-fg-muted);
  user-select: none;
  font-size: 11px;
  border-right: 1px solid var(--color-border-muted);
}

.blob-code {
  white-space: pre-wrap;
  word-break: break-all;
  padding-left: 12px !important;
}

/* Line Coverage Highlighting */
tr.line-covered {
  background-color: var(--color-success-subtle);
}

tr.line-covered .blob-hits {
  color: var(--color-success-fg);
  font-weight: 500;
}

tr.line-uncovered {
  background-color: var(--color-danger-subtle);
}

tr.line-uncovered .blob-hits {
  color: var(--color-danger-fg);
  font-weight: 600;
}

/* File Tree Sidebar & Layout */
.files-layout {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  width: 100%;
}

.files-sidebar {
  width: 280px;
  flex-shrink: 0;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.files-layout.sidebar-collapsed .files-sidebar {
  display: none;
}

.files-main {
  flex: 1;
  min-width: 0;
}

.sidebar-header {
  padding: 8px 12px;
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-fg-default);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-counter {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  background-color: var(--color-neutral-subtle);
  border-radius: 10px;
  color: var(--color-fg-muted);
}

.sidebar-btn-icon {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-btn-icon:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.sidebar-btn-icon:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.goto-box {
  padding: 8px 10px;
  border-bottom: 1px solid var(--color-border-muted);
  background-color: var(--color-canvas-default);
  position: relative;
}

.goto-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.goto-input {
  width: 100%;
  padding: 5px 28px 5px 28px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  outline: none;
}

.goto-input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.goto-input:focus {
  background-color: var(--color-canvas-default);
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.goto-icon {
  position: absolute;
  left: 8px;
  color: var(--color-fg-muted);
  pointer-events: none;
  display: flex;
  align-items: center;
  z-index: 1;
}

.goto-shortcut {
  position: absolute;
  right: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 4px;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: 3px;
  color: var(--color-fg-muted);
  pointer-events: none;
  line-height: 14px;
}

.goto-clear {
  position: absolute;
  right: 6px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
}

.goto-clear:hover {
  color: var(--color-fg-default);
}

.tree-container {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 4px;
  flex: 1;
}

.tree-node {
  position: relative;
  display: flex;
  align-items: center;
  padding: 4px 8px;
  font-size: 12px;
  line-height: 20px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-default);
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  gap: 6px;
  margin: 1px 0;
  transition: background-color 0.1s ease;
}

.tree-node:hover {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
}

.tree-node.selected {
  background-color: var(--color-accent-subtle);
  color: var(--color-fg-default);
  font-weight: 600;
}

.tree-node.selected::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 5px;
  bottom: 5px;
  width: 3px;
  background-color: var(--color-accent-fg);
  border-radius: 2px;
}

.tree-node:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.tree-node[data-tree-folder] .tree-icon {
  color: var(--color-accent-fg);
}

.tree-node[data-tree-file] .tree-icon {
  color: var(--color-fg-muted);
}

.tree-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  color: var(--color-fg-muted);
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

.tree-toggle-spacer {
  width: 16px;
  flex-shrink: 0;
}

.tree-icon {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.tree-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tree-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 10px;
  margin-left: 4px;
  flex-shrink: 0;
  line-height: 14px;
}

.tree-badge-high {
  color: var(--color-success-fg);
  background-color: var(--color-success-subtle);
}

.tree-badge-med {
  color: var(--color-attention-fg);
  background-color: var(--color-attention-subtle);
}

.tree-badge-low {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

.goto-results {
  overflow-y: auto;
  padding: 6px 4px;
  flex: 1;
}

.goto-item {
  position: relative;
  display: flex;
  align-items: center;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  gap: 8px;
  color: var(--color-fg-default);
  margin: 1px 0;
  transition: background-color 0.1s ease;
}

.goto-item:hover, .goto-item.active {
  background-color: var(--color-neutral-subtle);
}

.goto-item.selected {
  background-color: var(--color-accent-subtle);
  color: var(--color-fg-default);
  font-weight: 600;
}

.goto-item.selected::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 4px;
  bottom: 4px;
  width: 3px;
  background-color: var(--color-accent-fg);
  border-radius: 2px;
}

.goto-item-path {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
}

.goto-highlight {
  font-weight: 700;
  color: var(--color-accent-fg);
}

.goto-empty {
  padding: 24px 12px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 12px;
}

.sidebar-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
}

.sidebar-toggle-btn:hover {
  background-color: var(--color-canvas-default);
  border-color: var(--color-accent-fg);
}

.sidebar-toggle-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

/* Footer */
.gh-footer {
  border-top: 1px solid var(--color-border-default);
  padding: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--color-fg-muted);
  margin-top: auto;
}

.gh-footer a {
  color: var(--color-accent-fg);
  text-decoration: none;
}

.gh-footer a:hover {
  text-decoration: underline;
}

/* Badge Copy & Modal */
.badge-toolbar-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.badge-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  font-size: 12px;
  line-height: 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-default);
  background-color: var(--color-canvas-subtle);
  color: var(--color-fg-default);
  cursor: pointer;
  user-select: none;
  transition: all 0.15s ease;
}

.badge-btn:hover {
  background-color: var(--color-neutral-subtle);
  border-color: var(--color-border-muted);
}

.badge-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.badge-svg-display {
  display: inline-flex;
  align-items: center;
  line-height: 0;
}

.badge-svg-display svg {
  display: block;
  height: 18px;
  width: auto;
  border-radius: 3px;
}

.badge-copy-text {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 500;
  font-size: 12px;
}

/* Primer Toast Notification */
.gh-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 99999;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.gh-toast.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.gh-toast-icon {
  color: var(--color-success-fg);
  display: flex;
  align-items: center;
}

/* Badge Options Dialog / Popover */
.badge-modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.4);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.badge-modal {
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
  width: 100%;
  max-width: 520px;
  overflow: hidden;
  animation: modalFadeIn 0.15s ease-out;
}

@keyframes modalFadeIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.badge-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border-default);
}

.badge-modal-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-fg-default);
}

.badge-modal-close {
  background: none;
  border: none;
  color: var(--color-fg-muted);
  cursor: pointer;
  padding: 4px;
  font-size: 16px;
  display: flex;
  align-items: center;
  border-radius: var(--radius-sm);
}

.badge-modal-close:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.badge-modal-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.badge-preview-box {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-color: var(--color-canvas-subtle);
  border-radius: var(--radius-md);
  border: 1px dashed var(--color-border-default);
}

.badge-field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-default);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.badge-code-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.badge-code-input {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 60px 6px 10px;
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  color: var(--color-fg-default);
  outline: none;
}

.badge-code-input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.badge-copy-inline-btn {
  position: absolute;
  right: 4px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  color: var(--color-fg-default);
  cursor: pointer;
}

.badge-copy-inline-btn:hover {
  background-color: var(--color-neutral-subtle);
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .gh-header-inner, .file-toolbar, .commit-banner {
    flex-direction: column;
    align-items: flex-start;
  }
  .metrics-grid {
    grid-template-columns: 1fr;
  }
}

orks\n  serve               Start a local preview web server\n  init                Create a GitHub Actions workflow for GitHub Pages\n  help                Show this help screen\n\nOPTIONS:\n  -i, --input \u003cpath\u003e      Input coverage file (lcov.info, cobertura.xml, coverage-summary.json)\n  -o, --output \u003cdir\u003e      Output directory for generated site (default: \"covpages-dist\")\n  -f, --format \u003ctype\u003e     Coverage format: lcov | cobertura | json | auto (default: auto)\n  --history \u003cfile\u003e        Path to history JSON file (default: \"\u003coutput\u003e/history.json\")\n  --history-dir \u003cdir\u003e     Directory containing multiple commit reports (for trends)\n  --commit \u003csha\u003e          Commit SHA (defaults to git HEAD)\n  -m, --message \u003cmsg\u003e     Commit message (defaults to git HEAD message)\n  -a, --author \u003cauthor\u003e   Commit author (defaults to git author)\n  -b, --branch \u003cbranch\u003e   Branch name (defaults to git branch)\n  -t, --tag \u003ctag\u003e         Tag name (defaults to git tag if on tag)\n  --base-url \u003curl\u003e        Base URL for subdirectory hosting (e.g. \"/docs/covpages/\")\n  --save-raw              Save normalized raw lcov-\u003csha\u003e.info in history/lcov/\n  --docs                  Target docs/covpages for GitHub Pages deployment\n  --date \u003ciso-date\u003e       Commit date (defaults to git date or now)\n  --title \u003ctitle\u003e         Custom title for report\n  --repo \u003cname\u003e           Repository name\n  --no-source             Exclude embedding source code in report\n  --max-history \u003cnumber\u003e  Maximum number of history points (default: 100)\n  --range \u003cgit-range\u003e     Git revision range for backfill (e.g. HEAD~5..HEAD)\n  -n, --count \u003cnumber\u003e    Number of commits to backfill (default: 5)\n  --test-cmd \u003ccmd\u003e        Custom test command to run for backfill (e.g. \"npm test\")\n  --coverage-file \u003cpath\u003e  Coverage file produced by test command (default: \"coverage/lcov.info\")\n  --framework \u003cname\u003e      Target framework for init/presets (flutter, vitest, jest, rust, python, go, cpp)\n  -p, --port \u003cport\u003e       Port for local preview server (default: 8080)\n  -v, --version           Print version\n  -h, --help              Print help\n\nEXAMPLES:\n  # 1. Zero-build Drop-in: put index.html in gh-pages, then just cp lcov.info!\n  npx covpages dropin gh-pages\n  cp coverage/lcov.info gh-pages/\n\n  # 2. Backfill historical commits to create trend charts immediately\n  npx covpages backfill --range HEAD~10..HEAD --test-cmd \"npm test\"\n\n  # 3. Generate from lcov.info\n  npx covpages coverage/lcov.info\n\n  # 4. View framework integration workflows\n  npx covpages presets flutter\n  npx covpages presets vitest\n`;\n\nexport async function runCli(argv = process.argv.slice(2)): Promise\u003cvoid\u003e {\n  const options = {\n    input: { type: 'string' as const, short: 'i', multiple: true },\n    output: { type: 'string' as const, short: 'o', default: 'covpages-dist' },\n    format: { type: 'string' as const, short: 'f', default: 'auto' },\n    history: { type: 'string' as const },\n    'history-dir': { type: 'string' as const },\n    commit: { type: 'string' as const },\n    message: { type: 'string' as const, short: 'm' },\n    author: { type: 'string' as const, short: 'a' },\n    branch: { type: 'string' as const, short: 'b' },\n    tag: { type: 'string' as const, short: 't' },\n    'base-url': { type: 'string' as const },\n    'save-raw': { type: 'boolean' as const, default: false },\n    docs: { type: 'boolean' as const, default: false },\n    date: { type: 'string' as const },\n    title: { type: 'string' as const },\n    repo: { type: 'string' as const },\n    'no-source': { type: 'boolean' as const, default: false },\n    'max-history': { type: 'string' as const, default: '100' },\n    range: { type: 'string' as const },\n    count: { type: 'string' as const, short: 'n' },\n    'test-cmd': { type: 'string' as const },\n    'coverage-file': { type: 'string' as const },\n    framework: { type: 'string' as const },\n    port: { type: 'string' as const, short: 'p', default: '8080' },\n    version: { type: 'boolean' as const, short: 'v' },\n    help: { type: 'boolean' as const, short: 'h' },\n  };\n\n  let parsed;\n  try {\n    parsed = parseArgs({\n      args: argv,\n      options,\n      allowPositionals: true,\n      strict: false,\n    });\n  } catch (err: any) {\n    console.error(`Error: ${err.message}`);\n    console.log(HELP_TEXT);\n    process.exit(1);\n  }\n\n  const { values, positionals } = parsed;\n\n  if (values.version) {\n    console.log('covpages v0.1.0');\n    return;\n  }\n\n  if (values.help) {\n    console.log(HELP_TEXT);\n    return;\n  }\n\n  const firstArg = positionals[0];\n\n  const strVal = (v: any, fallback?: string): string | undefined =\u003e {\n    if (typeof v === 'string') return v;\n    return fallback;\n  };\n\n  // 1. Drop-in command\n  if (firstArg === 'dropin') {\n    const targetDir = positionals[1] || strVal(values.output, 'gh-pages')!;\n    createDropinSite(targetDir, strVal(values.title, 'Coverage Report'));\n    console.log(`\\n🎉 Zero-build Drop-in site created at: ${path.resolve(targetDir)}/index.html`);\n    console.log('   How to use:');\n    console.log('   1. Put your coverage file (lcov.info) into this directory.');\n    console.log('   2. Push to your \"gh-pages\" branch.');\n    console.log('   3. The page will fetch and parse lcov.info in real time on the client side!\\n');\n    return;\n  }\n\n  // 2. Presets command\n  if (firstArg === 'presets') {\n    const framework = positionals[1] || strVal(values.framework);\n    if (framework) {\n      const preset = getPreset(framework);\n      if (!preset) {\n        console.error(`\\nUnknown framework \"${framework}\". Available presets:`);\n        Object.keys(FRAMEWORK_PRESETS).forEach(k =\u003e console.log(` - ${k} (${FRAMEWORK_PRESETS[k].name})`));\n        console.log('');\n        process.exit(1);\n      }\n      console.log(`\\n📘 Framework Preset: ${preset.name}`);\n      console.log(`   Description:   ${preset.description}`);\n      console.log(`   Test Command:  ${preset.testCmd}`);\n      console.log(`   Coverage File: ${preset.coverageFile}\\n`);\n      console.log('--- Ready-to-use GitHub Actions Workflow (.github/workflows/covpages.yml) ---');\n      console.log(generatePresetWorkflow(framework));\n      return;\n    }\n\n    console.log('\\n🌟 Available Framework Presets:\\n');\n    for (const [key, preset] of Object.entries(FRAMEWORK_PRESETS)) {\n      console.log(`  • ${key.padEnd(10)} : ${preset.name.padEnd(32)} (${preset.testCmd})`);\n    }\n    console.log('\\nRun \"npx covpages presets \u003cframework\u003e\" to view full CI workflow and configuration.\\n');\n    return;\n  }\n\n  // 3. Backfill command\n  if (firstArg === 'backfill') {\n    const count = values.count ? parseInt(strVal(values.count)!, 10) : undefined;\n    console.log('\\n⏳ Starting commit backfill process...');\n    try {\n      const result = backfillCommits({\n        range: strVal(values.range),\n        count,\n        testCmd: strVal(values['test-cmd']),\n        coverageFile: strVal(values['coverage-file']),\n        outputDir: strVal(values.output, 'covpages-dist')!,\n        historyFile: strVal(values.history),\n        repoName: strVal(values.repo),\n        title: strVal(values.title),\n      });\n      console.log(`✅ Backfill completed with ${result.commits.length} commits in trend timeline!`);\n    } catch (err: any) {\n      console.error(`\\n❌ Error during backfill: ${err.message}\\n`);\n      process.exit(1);\n    }\n    return;\n  }\n\n  // 4. Init command\n  if (firstArg === 'init') {\n    const framework = strVal(values.framework);\n    const workflowDir = path.resolve('.github/workflows');\n    const workflowPath = path.join(workflowDir, 'covpages.yml');\n    if (!fs.existsSync(workflowDir)) {\n      fs.mkdirSync(workflowDir, { recursive: true });\n    }\n\n    const presetKey = framework && getPreset(framework) ? framework : 'vitest';\n    const workflowContent = generatePresetWorkflow(presetKey, { docs: Boolean(values.docs) });\n\n    fs.writeFileSync(workflowPath, workflowContent, 'utf-8');\n    console.log(`\\n✨ Created GitHub Actions workflow at: ${workflowPath}`);\n    if (values.docs) {\n      console.log('   Configured for GitHub Pages deployment from docs/covpages on main branch!\\n');\n    } else {\n      console.log('   Push to main branch to automatically generate and publish coverage to GitHub Pages!\\n');\n    }\n    return;\n  }\n\n  // 5. Serve command\n  if (firstArg === 'serve') {\n    const targetDir = positionals[1] || strVal(values.output, 'covpages-dist')!;\n    const port = parseInt(strVal(values.port, '8080')!, 10);\n    startServer(targetDir, port);\n    return;\n  }\n\n  // Determine command: if first arg is 'generate', shift it\n  const remainingPositionals = firstArg === 'generate' \n    ? positionals.slice(1) \n    : positionals;\n\n  // Gather inputs\n  const inputs: string[] = [];\n  if (values.input && Array.isArray(values.input)) {\n    for (const item of values.input) {\n      if (typeof item === 'string') inputs.push(item);\n    }\n  }\n  if (remainingPositionals.length \u003e 0) {\n    inputs.push(...remainingPositionals);\n  }\n\n  // Default input if none provided\n  if (inputs.length === 0) {\n    const candidates = [\n      'coverage/lcov.info',\n      'coverage/coverage-final.json',\n      'coverage/coverage-summary.json',\n      'coverage/cobertura-coverage.xml',\n      'lcov.info',\n    ];\n    for (const cand of candidates) {\n      if (fs.existsSync(cand)) {\n        inputs.push(cand);\n        break;\n      }\n    }\n  }\n\n  if (inputs.length === 0) {\n    console.error('Error: No coverage report file specified and default candidates not found.');\n    console.log('Please provide a coverage file (e.g. npx covpages coverage/lcov.info)\\n');\n    process.exit(1);\n  }\n\n  console.log(`\\n🔍 Parsing coverage report from: ${inputs.join(', ')}`);\n\n  const outputDir = values.docs && values.output === 'covpages-dist'\n    ? 'docs/covpages'\n    : strVal(values.output, 'covpages-dist')!;\n\n  try {\n    const result = generateCoveragePages({\n      inputs,\n      outputDir,\n      format: (strVal(values.format, 'auto') as SupportedFormat),\n      historyFile: strVal(values.history),\n      historyDir: strVal(values['history-dir']),\n      commitSha: strVal(values.commit),\n      commitMessage: strVal(values.message),\n      commitAuthor: strVal(values.author),\n      commitDate: strVal(values.date),\n      branch: strVal(values.branch),\n      tag: strVal(values.tag),\n      baseUrl: strVal(values['base-url']),\n      saveRaw: Boolean(values['save-raw']),\n      title: strVal(values.title),\n      repoName: strVal(values.repo),\n      includeSource: !values['no-source'],\n      maxHistoryCommits: parseInt(strVal(values['max-history'], '100')!, 10),\n    });\n\n    const linesPct = result.summary.lines.pct;\n    const fnPct = result.summary.functions.pct;\n    const brPct = result.summary.branches.pct;\n\n    console.log(`\\n✅ covpages generated successfully!`);\n    console.log(`   Output: ${path.resolve(outputDir)}/index.html`);\n    console.log(`   Lines:     ${linesPct}% (${result.summary.lines.covered}/${result.summary.lines.total})`);\n    console.log(`   Functions: ${fnPct}% (${result.summary.functions.covered}/${result.summary.functions.total})`);\n    console.log(`   Branches:  ${brPct}% (${result.summary.branches.covered}/${result.summary.branches.total})`);\n    console.log(`   Commits in trend: ${result.commits.length}`);\n\n    if (result.delta) {\n      const sign = result.delta.linesPct \u003e= 0 ? '+' : '';\n      console.log(`   Delta:     ${sign}${result.delta.linesPct}%\\n`);\n    } else {\n      console.log('');\n    }\n  } catch (err ath.join(dir, 'badge.svg'), generateBadgeSvg(100), 'utf-8');\n  fs.writeFileSync(path.join(dir, '404.html'), render404Html(), 'utf-8');\n}\n\n\nexport function generateCoveragePages(options: GenerateOptions): CovpagesData {\n  const outputDir = path.resolve(options.outputDir || './covpages-dist');\n  const rootDir = options.rootDir ? path.resolve(options.rootDir) : process.cwd();\n  const maxHistory = options.maxHistoryCommits || 100;\n\n  if (!fs.existsSync(outputDir)) {\n    fs.mkdirSync(outputDir, { recursive: true });\n  }\n\n  // 1. Resolve commit info for current run\n  const currentCommit = resolveCommitInfo({\n    cwd: rootDir,\n    sha: options.commitSha,\n    message: options.commitMessage,\n    author: options.commitAuthor,\n    date: options.commitDate,\n    branch: options.branch,\n    tag: options.tag,\n  });\n\n  // 2. Load existing history\n  const historyPath = options.historyFile \n    ? path.resolve(options.historyFile) \n    : path.join(outputDir, 'history.json');\n  \n  let commitsHistory = loadHistory(historyPath);\n\n  // If a historyDir is provided, load and parse any historical coverage files\n  if (options.historyDir && fs.existsSync(options.historyDir)) {\n    const historyFiles = fs.readdirSync(options.historyDir)\n      .filter((f: string) =\u003e !f.startsWith('.') && (f.endsWith('.lcov') || f.endsWith('.info') || f.endsWith('.xml') || f.endsWith('.json')))\n      .sort();\n\n    for (const hFile of historyFiles) {\n      const fullHPath = path.join(options.historyDir, hFile);\n      const parsedHFiles = parseCoverageFile(fullHPath, {\n        format: options.format,\n        rootDir,\n        includeSource: false,\n      });\n      const aggregatedH = aggregateCoverage(parsedHFiles);\n\n      // Extract metadata from filename if possible, e.g. \u003csha\u003e_\u003cdate\u003e_\u003cbranch\u003e.lcov\n      const baseName = path.basename(hFile, path.extname(hFile));\n      const parts = baseName.split('_');\n      const hSha = parts[0]   let reqUrl = req.url || '/';\n    reqUrl = reqUrl.split('?')[0]; // strip query string\n\n    let relativePath = decodeURIComponent(reqUrl);\n    if (relativePath.endsWith('/')) {\n      relativePath += 'index.html';\n    }\n\n    const filePath = path.join(resolvedDir, relativePath);\n\n    // Prevent directory traversal\n    if (!filePath.startsWith(resolvedDir)) {\n      res.writeHead(403, { 'Content-Type': 'text/plain' });\n      res.end('403 Forbidden');\n      return;\n    }\n\n    if (!fs.existsSync(filePath)) {\n      // Fallback to index.html for SPA-style routing if file does not exist\n      const fallbackIndex = path.join(resolvedDir, 'index.html');\n      if (fs.existsSync(fallbackIndex)) {\n        res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });\n        fs.createReadStream(fallbackIndex).pipe(res);\n        return;\n      }\n      res.writeHead(404, { 'Content-Type': 'text/plain' });\n      res.end('404 Not Found');\n      return;\n    }\n\n    const stat = fs.statSync(filePath);\n    if (stat.isDirectory()) {\n      const indexFile = path.join(filePath, 'index.html');\n      if (fs.existsSync(indexFile)) {\n        res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });\n        fs.createReadStream(indexFile).pipe(res);\n        return;\n      }\n      res.writeHead(403, { 'Content-Type': 'text/plain' });\n      res.end('403 Forbidden');\n      return;\n    }\n\n    const ext = path.extname(filePath).toLowerCase();\n    const contentType = MIME_TYPES[ext] || 'application/octet-stream';\n\n    res.writeHead(200, {\n      'Content-Type': contentType,\n      'Content-Length': stat.size,\n    });\n    fs.createReadStream(filePath).pipe(res);\n  });\n\n  server.listen(port, () =\u003e {\n    console.log(`\\n🚀 covpages preview server running at:`);\n    console.log(`   http://localhost:${port}/`);\n    console.log(`   Directory: ${resolvedDir}\\n`);\n  });\n\n  return server;\n}\n"},"src/types.ts":{"path":"src/types.ts","l ntry,\n  CommitInfo,\n  CovpagesData,\n  FileCoverage,\n} from '../types.js';\nimport { parseCoverageFile } from '../parsers/index.js';\nimport { aggregateCoverage } from './aggregator.js';\nimport {\n  createCommitHistoryEntry,\n  buildTrends,\n  loadHistory,\n  saveHistory,\n  appendOrUpdateCommit,\n  calculateDelta,\n} from './history.js';\nimport { renderIndexHtml } from '../templates/index.html.js';\n\nexport interface BackfillOptions {\n  range?: string;\n  count?: number;\n  testCmd?: string;\n  coverageFile?: string;\n  outputDir?: string;\n  historyFile?: string;\n  repoName?: string;\n  title?: string;\n  cwd?: string;\n}\n\nfunction runGit(cmd: string, cwd: string): string {\n  return execSync(`git ${cmd}`, {\n    cwd,\n    encoding: 'utf-8',\n    stdio: ['pipe', 'pipe', 'ignore'],\n  }).trim();\n}\n\nexport function backfillCommits(options: BackfillOptions = {}): CovpagesData {\n  const cwd = path.resolve(options.cwd || process.cwd());\n  const outputDir = path.resolve(options.outputDir || 'covpages-dist');\n  const historyPath = options.historyFile \n    ? path.resolve(options.historyFile) \n    : path.join(outputDir, 'history.json');\n\n  if (!fs.existsSync(outputDir)) {\n    fs.mkdirSync(outputDir, { recursive: true });\n  }\n\n  // 1. Check if git repo\n  try {\n    runGit('rev-parse --is-inside-work-tree', cwd);\n  } catch {\n    throw new Error(`Directory is not a git repository: ${cwd}`);\n  }\n\n  // 2. Save current ref\n  let currentRef = runGit('rev-parse --abbrev-ref HEAD', cwd);\n  if (currentRef === 'HEAD') {\n    currentRef = runGit('rev-parse HEAD', cwd);\n  }\n\n  // 3. Stash any uncommitted work\n  const status = runGit('status --porcelain', cwd);\n  let didStash = false;\n  if (status.length \u003e 0) {\n    console.log('📦 Working tree is dirty; stashing uncommitted changes...');\n    try {\n      execSync('git stash push -u -m \"covpages-backfill-temporary-stash\"', { cwd, stdio: 'ignore' });\n      didStash = true;\n    } catch {\n      // ignore\n    }\n  }\n\n  // 4. Resolve commit list\n  let revs: string[] = [];\n  if (options.range) {\n    revs = runGit(`rev-list --reverse ${options.range}`, cwd).split(/\\r?\\n/).filter(Boolean);\n  } else {\n    const count = options.count || 5;\n    revs = runGit(`rev-list --reverse -n ${count} HEAD`, cwd).split(/\\r?\\n/).filter(Boolean);\n  }\n\n  if (revs.length === 0) {\n    throw new Error('No commits found in the specified range.');\n  }\n\n  console.log(`\\n⏳ Found ${revs.length} commits to backfill.`);\n\n  // Determine test command\n  let testCmd = options.testCmd;\n  if (!testCmd) {\n    const pkgPath = path.join(cwd, 'package.json');\n    if (fs.existsSync(pkgPath)) {\n      try {\n        const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf-8'));\n        if (pkg.scripts && pkg.scripts['test:coverage']) {\n          testCmd = 'npm run test:coverage';\n        } else if (pkg.scripts && pkg.scripts.test) {\n          testCmd = 'npm test';\n        }\n      } catch {\n        // ignore\n      }\n    }\n  }\n  if (!testCmd) {\n    testCmd = 'npm test';\n  }\n\n  const covFileRelative = options.coverageFile || 'coverage/lcov.info';\n\n  let commitsHistory = loadHistory(historyPath);\n  let lastFiles: Record\u003cstring, FileCoverage\u003e = {};\n  let lastCommitInfo: CommitInfo | undefined;\n\n  try {\n    for (let i = 0; i \u003c revs.length; i++) {\n      const sha = revs[i];\n      const shortSha = sha.slice(0, 7);\n      const message = runGit(`log -1 --pretty=%B ${sha}`, cwd).split('\\n')[0].trim();\n      const author = runGit(`log -1 --pretty=%an ${sha}`, cwd).trim();\n      const date = new Date(runGit(`log -1 --pretty=%cI ${sha}`, cwd).trim()).toISOString();\n      const branch = runGit(`branch --contains ${sha}`, cwd).replace(/^\\*?\\s+/, '').split('\\n')[0] || 'main';\n\n      console.log(`[${i + 1}/${revs.length}] Checking out ${shortSha}: \"${message}\"`);\n      execSync(`git checkout -q ${sha}`, { cwd, stdio: 'ignore' });\n\n      // n    for (const l of rec.lines) {\n      if (l.startsWith('SF:') || l === 'end_of_record') continue;\n      if (l.startsWith('FN:')) fnLines.push(l);\n      else if (l.startsWith('FNDA:')) fndaLines.push(l);\n      else if (l.startsWith('FNF:')) fnf = l;\n      else if (l.startsWith('FNH:')) fnh = l;\n      else if (l.startsWith('BRDA:')) brdaLines.push(l);\n      else if (l.startsWith('BRF:')) brf = l;\n      else if (l.startsWith('BRH:')) brh = l;\n      else if (l.startsWith('DA:')) daLines.push(l);\n      else if (l.startsWith('LF:')) lf = l;\n      else if (l.startsWith('LH:')) lh = l;\n    }\n\n    // Sort FN by line number\n    fnLines.sort((a, b) =\u003e {\n      const lineA = parseInt(a.slice(3).split(',')[0], 10) || 0;\n      const lineB = parseInt(b.slice(3).split(',')[0], 10) || 0;\n      return lineA - lineB;\n    });\n\n    // Sort FNDA by function name\n    fndaLines.sort((a, b) =\u003e a.localeCompare(b));\n\n    // Sort BRDA by line, block, branch\n    brdaLines.sort((a, b) =\u003e {\n      const partsA = a.slice(5).split(',').map(Number);\n      const partsB = b.slice(5).split(',').map(Number);\n      for (let i = 0; i \u003c Math.min(partsA.length, partsB.length); i++) {\n        if (partsA[i] !== partsB[i]) return partsA[i] - partsB[i];\n      }\n      return 0;\n    });\n\n    // Sort DA numerically by line number\n    daLines.sort((a, b) =\u003e {\n      const lineA = parseInt(a.slice(3).split(',')[0], 10) || 0;\n      const lineB = parseInt(b.slice(3).split(',')[0], 10) || 0;\n      return lineA - lineB;\n    });\n\n    output.push(`SF:${rec.sf}`);\n    output.push(...fnLines);\n    output.push(...fndaLines);\n    if (fnf) output.push(fnf);\n    if (fnh) output.push(fnh);\n    output.push(...brdaLines);\n    if (brf) output.push(brf);\n    if (brh) output.push(brh);\n    output.push(...daLines);\n    if (lf) output.push(lf);\n    if (lh) output.push(lh);\n    output.push('end_of_record');\n  }\n\n  return output.join('\\n') + '\\n';\n}\n\n/**\ t projects with @vitest/coverage-v8 or istanbul',\n    workflowStep: `      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n\n      - name: Run Tests with Coverage\n        run: |\n          npm ci\n          npx vitest run --coverage`,\n  },\n  jest: {\n    name: 'Jest (JavaScript / TypeScript)',\n    language: 'javascript',\n    testCmd: 'npx jest --coverage --coverageReporters=\"lcov\"',\n    coverageFile: 'coverage/lcov.info',\n    description: 'Jest test suites configured with lcov reporter',\n    workflowStep: `      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n\n      - name: Run Tests with Coverage\n        run: |\n          npm ci\n          npx jest --coverage --coverageReporters=\"lcov\"`,\n  },\n  rust: {\n    name: 'Rust (cargo-llvm-cov)',\n    language: 'rust',\n    testCmd: 'cargo llvm-cov --lcov --output-path coverage/lcov.info',\n    coverageFile: 'coverage/lcov.info',\n    description: 'Rust crates using cargo-llvm-cov source-based coverage',\n    workflowStep: `      - name: Install Rust toolchain\n        uses: dtolnay/rust-toolchain@stable\n\n      - name: Install cargo-llvm-cov\n        uses: taiki-e/install-action@cargo-llvm-cov\n\n      - name: Run Tests with Coverage\n        run: |\n          mkdir -p coverage\n          cargo llvm-cov --lcov --output-path coverage/lcov.info`,\n  },\n  python: {\n    name: 'Python (pytest-cov)',\n    language: 'python',\n    testCmd: 'pytest --cov --cov-report=lcov:coverage/lcov.info',\n    coverageFile: 'coverage/lcov.info',\n    description: 'Python projects using pytest and pytest-cov lcov output',\n    workflowStep: `      - name: Setup Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n\n      - name: Run Tests with Coverage\n        run: |\n          pip install pytest pytest-cov\n          pytest --cov --cov-report=lcov:coverage/lcov.info`,\ 003e\n              \u003cdiv\u003e# Rust\u003c/div\u003e\n              \u003cdiv style=\"color: var(--color-accent-fg); margin-bottom: 8px;\"\u003ecargo llvm-cov --lcov --output-path lcov.info\u003c/div\u003e\n              \u003cdiv\u003e# Python\u003c/div\u003e\n              \u003cdiv style=\"color: var(--color-accent-fg);\"\u003epytest --cov --cov-report=lcov:lcov.info\u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/main\u003e\n    \\`;\n  }\n\n  // Main Render Routine\n  function render() {\n    if (!data) {\n      container.innerHTML = renderEmptyState();\n      bindEmptyEvents();\n      return;\n    }\n\n    activeView = getActiveViewData();\n\n    let mainContent = '';\n\n    if (state.activeTab === 'files') {\n      let mainPane = '';\n      if (state.selectedFile) {\n        mainPane = renderFileViewer();\n      } else {\n        const vFolders = activeView?.folders || data.folders || {};\n        const vSummary = activeView?.summary || data.summary;\n        const currentFolderCov = vFolders[state.currentFolder] || vSummary;\n        const trendPoints = state.currentFolder \n          ? data.trends?.folders?.[state.currentFolder] \n          : data.trends?.overall;\n\n        mainPane = \\`\n          \\${renderCommitBanner()}\n          \\${renderMetrics(currentFolderCov, activeView?.delta ?? data.delta)}\n          \\${trendPoints && trendPoints.length \u003e 1 ? renderTrendChart(state.currentFolder ? \\`Folder Trend: \\${state.currentFolder}\\` : 'Overall Coverage Trend', trendPoints, state.trendMetric) : ''}\n          \\${renderTable()}\n        \\`;\n      }\n\n      mainContent = \\`\n        \u003cdiv class=\"files-layout \\${state.sidebarVisible ? '' : 'sidebar-collapsed'}\"\u003e\n          \u003caside class=\"files-sidebar\" aria-label=\"Files tree\"\u003e\n            \\${renderSidebar()}\n          \u003c/aside\u003e\n          \u003cdiv class=\"files-main\"\u003e\n            \\${mainPane}\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \\`;\n    } else if (state.activeTab === 'trends') {\n      mainContent = renderTrendsTab();\n    } else if (state.activeTab === 'commits') {\n      mainContent = renderCommitsTab();\n    }\n\n    container.innerHTML = \\`\n      \\${renderHeader()}\n      \u003cmain class=\"gh-container\"\u003e\n        \\${mainContent}\n      \u003c/main\u003e\n      \u003cfooter class=\"gh-footer\"\u003e\n        Generated by \u003ca href=\"https://github.com/yongjhih/covpages\" target=\"_blank\" rel=\"noopener\"\u003ecovpages\u003c/a\u003e • \n        \\${escapeHtml(data.generatedAt ? formatDate(data.generatedAt) : new Date().toISOString())}\n      \u003c/footer\u003e\n    \\`;\n\n    bindEvents();\n  }\n\n  function bindEmptyEvents() {\n    const themeBtn = document.getElementById('theme-toggle-btn');\n    if (themeBtn) {\n      themeBtn.addEventListener('click', () =\u003e {\n        const nextTheme = state.theme === 'dark' ? 'light' : 'dark';\n        applyTheme(nextTheme);\n        render();\n      });\n    }\n\n    const dropZone = document.getElementById('drop-zone');\n    const fileInput = document.getElementById('lcov-file-input');\n    const selectBtn = document.getElementById('select-file-btn');\n\n    if (selectBtn && fileInput) {\n      selectBtn.addEventListener('click', (e) =\u003e {\n        e.stopPropagation();\n        fileInput.click();\n      });\n    }\n\n    if (dropZone && fileInput) {\n      dropZone.addEventListener('click', () =\u003e fileInput.click());\n\n      dropZone.addEventListener('dragover', (e) =\u003e {\n        e.preventDefault();\n        dropZone.style.borderColor = 'var(--color-accent-fg)';\n      });\n\n      dropZone.addEventListener('dragleave', () =\u003e {\n        dropZone.style.borderColor = 'var(--color-border-default)';\n      });\n\n      dropZone.addEventListener('drop', (e) =\u003e {\n        e.preventDefault();\n        dropZone.style.borderColor = 'var(--color-border-default)';\n        if (e.dataTransfer?.files?.length) {\n          handleFile(e.dataTransfer.files[0]);\n        }\n      });\n\n      fileInput.addEventListener('change', (e) =\u003e {\n        if (e.target.files?.length) {\n          handleFile(e.target.files[0]);\n        }\n      });\n    }\n\n    function handleFile(file) {\n      const reader = new FileReader();\n      reader.onload = (e) =\u003e {\n        const text = e.target?.result;\n        if (typeof text === 'string') {\n          data = parseClientLcov(text);\n          initState();\n          render();\n        }\n      };\n      reader.readAsText(file);\n    }\n  }\n\n  // Event handlers\n  function bindEvents() {\n    const themeBtn = document.getElementById('theme-toggle-btn');\n    if (themeBtn) {\n      themeBtn.addEventListener('click', () =\u003e {\n        const nextTheme = state.theme === 'dark' ? 'light' : 'dark';\n        applyTheme(nextTheme);\n        render();\n      });\n    }\n\n    // Ref selector dropdown\n    const refBtn = document.getElementById('ref-selector-btn');\n    if (refBtn) {\n      refBtn.addEventListener('click', (e) =\u003e {\n        e.stopPropagation();\n        state.refPopoverOpen = !state.refPopoverOpen;\n        state.refSearchText = '';\n        render();\n        if (state.refPopoverOpen) {\n          const input = document.getElementById('ref-search-input');\n          if (input) input.focus();\n        }\n      });\n    }\n\n    const refCloseBtn = document.getElementById('ref-popover-close');\n    if (refCloseBtn) {\n      refCloseBtn.addEventListener('click', (e) =\u003e {\n        e.stopPropagation();\n        state.refPopoverOpen = false;\n        render();\n      });\n    }\n\n    document.querySelectorAll('.ref-tab').forEach(tab =\u003e {\n      tab.addEventListener('click', (e) =\u003e {\n        e.stopPropagation();\n        state.refActiveTab = tab.getAttribute('data-ref-tab');\n        render();\n        const input = document.getElementById('ref-search-input');\n        if (input) input.focus();\n      });\n    });\n\n    const refSearchInput = document.getElementById('ref-search-input');\n    if (refSearchInput) {\n      refSearchInput.addEventListener('click', (e) =\u003e e.stopPropagation());\n      refSearchInput.addEventListener('input', (e) =\u003e {\n        state.refSearchText = e.target.value;\n        const popoverEl = document.getElementById('ref-popover');\n        if (popoverEl) {\n          popoverEl.outerHTML = renderRefPopover();\n          bindEvents();\n          const inp = document.getElementById('ref-search-input');\n          if (inp) {\n            inp.focus();\n            inp.selectionStart = inp.selectionEnd = inp.value.length;\n          }\n        }\n      });\n    }\n\n    document.querySelectorAll('.ref-item').forEach(item =\u003e {\n      item.addEventListener('click', (e) =\u003e {\n        e.stopPropagation();\n        const refType = item.getAttribute('data-ref-type');\n        const refName = item.getAttribute('data-ref-name');\n        const refSha = item.getAttribute('data-ref-sha');\n        selectRef(refType, refName, refSha);\n      });\n    });\n\n    if (state.refPopoverOpen) {\n      const handleOutsideClick = (e) =\u003e {\n        if (!e.target.closest('.ref-selector-wrap')) {\n          state.refPopoverOpen = false;\n          document.removeEventListener('click', handleOutsideClick);\n          render();\n        }\n      };\n      setTimeout(() =\u003e {\n        document.addEventListener('click', handleOutsideClick);\n      }, 0);\n    }\n\n    // Commits tab click to view commit coverage snapshot\n    document.querySelectorAll('[data-commit-sha]').forEach(row =\u003e {\n      row.addEventListener('click', () =\u003e {\n        const sha = row.getAttribute('data-commit-sha');\n        state.selectedCommitSha = sha;\n        const found = data?.commits?.find(c =\u003e c.commit.sha === sha);\n        if (found) {\n          if (found.commit.tag) {\n            state.activeRefType = 'tag';\n            state.activeRefName = found.commit.tag;\n          } else if (found.commit.branch) {\n            state.activeRefType = 'branch';\n            state.activeRefName = found.commit.branch;\n          }\n        }\n        state.activeTab = 'files';\n        state.selectedFile = null;\n        updateRoute();\n        render();\n      });\n    });\n\n    // Badge copy buttons (header, folder, file)\n    document.querySelectorAll('[data-badge-copy]').forEach(btn =\u003e {\n      btn.addEventListener('click', (e) =\u003e {\n        e.stopPropagation();\n        const scope = btn.getAttribute('data-badge-copy');\n        let label = 'coverage';\n        let pct = activeView?.summary?.lines?.pct || 100;\n        let filename = 'badge.svg';\n\n        if (scope === 'folder') {\n          const folder = btn.getAttribute('data-badge-folder') || state.currentFolder || '';\n          const parts = folder ? folder.split('/') : [];\n          label = parts.length \u003e 0 ? parts[parts.length - 1] : (data?.repoName || 'coverage');\n          const fCov = activeView?.folders?.[folder] || activeView?.summary;\n          pct = fCov?.lines?.pct || 100;\n          filename = folder ? 'folder-' + sanitizeBadgeName(folder) + '.svg' : 'badge.svg';\n        } else if (scope === 'file') {\n          const file = btn.getAttribute('data-badge-file') || state.selectedFile || '';\n          const parts = file.split('/');\n          label = parts[parts.length - 1];\n          const fCov = activeView?.files?.[file];\n          pct = fCov?.lines?.pct || 100;\n          filename = 'file-' + sanitizeBadgeName(file) + '.svg';\n        } else if (scope === 'ref') {\n          label = state.activeRefName || data?.currentCommit?.branch || 'coverage';\n          pct = activeView?.summary?.lines?.pct || 100;\n          filename = 'branch-' + sanitizeBadgeName(label) + '.svg';\n        }\n\n        copyBadgeMarkdown(label, pct, filename);\n      });\n    });\n\n    // Sidebar toggle and collapse\n    const collapseBtn = document.getElementById('sidebar-collapse-btn');\n    if (collapseBtn) {\n      collapseBtn.addEventListener('click', () =\u003e {\n        state.sidebarVisible = false;\n        localStorage.setItem('covpages-sidebar', 'false');\n        render();\n      });\n    }\n\n    const expandBtn = document.getElementById('sidebar-expand-btn');\n    if (expandBtn) {\n      expandBtn.addEventListener('click', () =\u003e {\n        state.sidebarVisible = true;\n        localStorage.setItem('covpages-sidebar', 'true');\n        render();\n      });\n    }\n\n    // Go to file search\n    const gotoInput = document.getElementById('goto-input');\n    if (gotoInput) {\n      gotoInput.addEventListener('input', (e) =\u003e {\n        state.gotoFilterText = e.target.value;\n        state.gotoActiveIndex = 0;\n        const sidebar = document.querySelector('.files-sidebar');\n        if (sidebar) {\n          sidebar.innerHTML = renderSidebar();\n          bindEvents();\n          const gi = document.getElementById('goto-input');\n          if (gi) {\n            gi.focus();\n            gi.selectionStart = gi.selectionEnd = gi.value.length;\n          }\n        }\n      });\n\n      gotoInput.addEventListener('keydown', (e) =\u003e {\n        const query = state.gotoFilterText.trim().toLowerCase();\n        const allFiles = Object.keys(data.files || {}).filter(f =\u003e f.toLowerCase().includes(query));\n        allFiles.sort((a, b) =\u003e {\n          const aBase = a.split('/').pop()?.toLowerCase() || '';\n          const bBase = b.split('/').pop()?.toLowerCase() || '';\n          const aStarts = aBase.startsWith(query);\n          const bStarts = bBase.startsWith(query);\n          if (aStarts && !bStarts) return -1;\n          if (!aStarts && bStarts) return 1;\n          return a.localeCompare(b);\n        });\n\n        if (e.key === 'ArrowDown') {\n          e.preventDefault();\n          if (allFiles.length \u003e 0) {\n            state.gotoActiveIndex = Math.min(state.gotoActiveIndex + 1, Math.min(allFiles.length, 50) - 1);\n            updateGotoActive();\n          }\n        } else if (e.key === 'ArrowUp') {\n          e.preventDefault();\n          if (allFiles.length \u003e 0) {\n            state.gotoActiveIndex = Math.max(state.gotoActiveIndex - 1, 0);\n            updateGotoActive();\n          }\n        } else if (e.key === 'Enter') {\n          e.preventDefault();\n          if (allFiles.length \u003e 0 && allFiles[state.gotoActiveIndex]) {\n            const target = allFiles[state.gotoActiveIndex];\n            state.selectedFile = target;\n            state.gotoFilterText = '';\n            ensureExpanded(target);\n            updateRoute();\n            render();\n          }\n        } else if (e.key === 'Escape') {\n          e.preventDefault();\n          state.gotoFilterText = '';\n          render();\n        }\n      });\n    }\n\n    function updateGotoActive() {\n      const items = document.querySelectorAll('.goto-item');\n      items.forEach((item, idx) =\u003e {\n        if (idx === state.gotoActiveIndex) {\n          item.classList.add('active');\n          item.scrollIntoView({ block: 'nearest' });\n        } else {\n          item.classList.remove('active');\n        }\n      });\n    }\n\n    const gotoClear = document.getElementById('goto-clear');\n    if (gotoClear) {\n      gotoClear.addEventListener('click', () =\u003e {\n        state.gotoFilterText = '';\n        render();\n        const gi = document.getElementById('goto-input');\n        if (gi) gi.focus();\n      });\n    }\n\n    // Go to file item click\n    document.querySelectorAll('[data-goto-file]').forEach(el =\u003e {\n      el.addEventListener('click', () =\u003e {\n        const file = el.getAttribute('data-goto-file');\n        state.selectedFile = file;\n        state.gotoFilterText = '';\n        ensureExpanded(file);\n        updateRoute();\n        render( 29');\n}\n\nexport function renderIndexHtml(data?: CovpagesData | null, options: { inline?: boolean } = {}): {\n  html: string;\n  css: string;\n  js: string;\n  dataJs: string;\n} {\n  const jsonStr = data ? serializeForScript(data) : 'null';\n  const iconsStr = serializeForScript(ICONS);\n  const dataJs = `window.__COVPAGES_DATA__ = ${jsonStr};\\nwindow.__COVPAGES_ICONS__ = ${iconsStr};`;\n\n  const safeTitle = data?.title ? `${data.title} - covpages` : 'Coverage Report - covpages';\n\n  const html = `\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n  \u003cmeta name=\"description\" content=\"Unit test coverage report with multi-commit trends powered by covpages\"\u003e\n  \u003cmeta name=\"color-scheme\" content=\"light dark\"\u003e\n  \u003ctitle\u003e${safeTitle}\u003c/title\u003e\n  \u003cstyle\u003e\n${STYLES_CSS}\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cdiv id=\"covpages-app\"\u003e\n    \u003cnoscript\u003e\n      \u003cdiv style=\"padding: 24px; text-align: center; font-family: sans-serif;\"\u003e\n        \u003ch2\u003eJavaScript is required to view interactive coverage reports.\u003c/h2\u003e\n        ${data ? `\u003cp\u003eOverall Line Coverage: \u003cstrong\u003e${data.summary.lines.pct}%\u003c/strong\u003e (${data.summary.lines.covered}/${data.summary.lines.total})\u003c/p\u003e` : ''}\n      \u003c/div\u003e\n    \u003c/noscript\u003e\n  \u003c/div\u003e\n  \u003cdiv id=\"chart-tooltip\" class=\"chart-tooltip\" role=\"tooltip\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n  \u003cscript\u003e\n${dataJs}\n  \u003c/script\u003e\n  \u003cscript\u003e\n${APP_JS}\n  \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e`;\n\n  return {\n    html,\n    css: STYLES_CSS,\n    js: APP_JS,\n    dataJs,\n  };\n}\n\nexport function renderDropinHtml(title = 'Coverage Report'): {\n  html: string;\n  css: string;\n  js: string;\n  dataJs: string;\n} {\n  return renderIndexHtml(null);\n}\n\nexport function render404Html(): string {\n  return `\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003ctitle\u003eCovpages\u003c/title\u003e\n  \u003cscript\u003e\n    (function() {\n      var l = window.location;\n      var path = l.pathname;\n      var segments = path.split('/').filter(Boolean);\n      var basePath = '/';\n      var route = '';\n      if (segments.length \u003e 0 && (segments[0] === 'covpages' || l.hostname.endsWith('github.io'))) {\n        basePath = '/' + segments[0] + '/';\n        route = segments.slice(1).join('/');\n      } else {\n        route = segments.join('/');\n      }\n      var target = basePath + '?/' + encodeURI(route) + (l.search ? '&' + l.search.slice(1) : '') + l.hash;\n      l.replace(target);\n    })();\n  \u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cp\u003eRedirecting to Covpages...\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e`;\n}\n"},"src/templates/styles.css.ts":{"path":"src/templates/styles.css.ts","lines":{"total":1,"covered":1,"skipped":0,"pct":100},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"1":{"hits":1}},"sourceCode":"export const STYLES_CSS = `\n/* Primer-inspired GitHub theme design tokens */\n:root {\n  --font-sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Noto Sans\", Helvetica, Arial, sans-serif;\n  --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n\n  --color-canvas-default: #ffffff;\n  --color-canvas-subtle: #f6f8fa;\n  --color-canvas-inset: #f6f8fa;\n  --color-border-default: #d0d7de;\n  --color-border-muted: #d8dee4;\n  --color-fg-default: #1f2328;\n  --color-fg-muted: #656d76;\n  --color-fg-subtle: #6e7781;\n  --color-accent-fg: #0969da;\n  --color-accent
