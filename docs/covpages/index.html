<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unit test coverage report with multi-commit trends powered by covpages">
  <meta name="color-scheme" content="light dark">
  <title>covpages Coverage - covpages</title>
  <style>

/* Primer-inspired GitHub theme design tokens */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #656d76;
  --color-fg-subtle: #6e7781;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: #ddf4ff;
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: #dafbe1;
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: #ffebe9;
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #bf8700;
  --color-attention-subtle: #fff8c5;
  --color-neutral-subtle: rgba(234, 238, 242, 0.5);

  --chart-grid: #eaeef2;
  --chart-line: #0969da;
  --chart-fill: rgba(9, 105, 218, 0.08);

  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --shadow-sm: 0 1px 0 rgba(27, 31, 36, 0.04);
  --shadow-rest: 0 1px 3px rgba(31, 35, 40, 0.12), 0 1px 2px rgba(31, 35, 40, 0.14);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-canvas-default: #0d1117;
    --color-canvas-subtle: #161b22;
    --color-canvas-inset: #010409;
    --color-border-default: #30363d;
    --color-border-muted: #21262d;
    --color-fg-default: #e6edf3;
    --color-fg-muted: #848d97;
    --color-fg-subtle: #6e7681;
    --color-accent-fg: #2f81f7;
    --color-accent-emphasis: #1f6feb;
    --color-accent-subtle: rgba(56, 139, 253, 0.15);
    --color-success-fg: #3fb950;
    --color-success-emphasis: #238636;
    --color-success-subtle: rgba(46, 160, 67, 0.15);
    --color-danger-fg: #f85149;
    --color-danger-emphasis: #da3633;
    --color-danger-subtle: rgba(248, 81, 73, 0.15);
    --color-attention-fg: #d29922;
    --color-attention-emphasis: #9e6a03;
    --color-attention-subtle: rgba(187, 128, 9, 0.15);
    --color-neutral-subtle: rgba(110, 118, 129, 0.1);

    --chart-grid: #21262d;
    --chart-line: #2f81f7;
    --chart-fill: rgba(47, 129, 247, 0.12);
  }
}

:root[data-theme="dark"] {
  --color-canvas-default: #0d1117;
  --color-canvas-subtle: #161b22;
  --color-canvas-inset: #010409;
  --color-border-default: #30363d;
  --color-border-muted: #21262d;
  --color-fg-default: #e6edf3;
  --color-fg-muted: #848d97;
  --color-fg-subtle: #6e7681;
  --color-accent-fg: #2f81f7;
  --color-accent-emphasis: #1f6feb;
  --color-accent-subtle: rgba(56, 139, 253, 0.15);
  --color-success-fg: #3fb950;
  --color-success-emphasis: #238636;
  --color-success-subtle: rgba(46, 160, 67, 0.15);
  --color-danger-fg: #f85149;
  --color-danger-emphasis: #da3633;
  --color-danger-subtle: rgba(248, 81, 73, 0.15);
  --color-attention-fg: #d29922;
  --color-attention-emphasis: #9e6a03;
  --color-attention-subtle: rgba(187, 128, 9, 0.15);
  --color-neutral-subtle: rgba(110, 118, 129, 0.1);

  --chart-grid: #21262d;
  --chart-line: #2f81f7;
  --chart-fill: rgba(47, 129, 247, 0.12);
}

:root[data-theme="light"] {
  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #656d76;
  --color-fg-subtle: #6e7781;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: #ddf4ff;
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: #dafbe1;
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: #ffebe9;
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #bf8700;
  --color-attention-subtle: #fff8c5;
  --color-neutral-subtle: rgba(234, 238, 242, 0.5);

  --chart-grid: #eaeef2;
  --chart-line: #0969da;
  --chart-fill: rgba(9, 105, 218, 0.08);
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header bar */
.gh-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 12px 24px;
}

.gh-header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.gh-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--color-fg-default);
  font-weight: 600;
  font-size: 16px;
}

.gh-brand-icon {
  display: flex;
  align-items: center;
  color: var(--color-fg-default);
}

.gh-repo-title {
  color: var(--color-accent-fg);
  font-weight: 600;
}

.gh-header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* GitHub Buttons & Selectors */
.gh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  line-height: 20px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
  text-decoration: none;
  transition: 80ms cubic-bezier(0.33, 1, 0.68, 1);
  box-shadow: var(--shadow-sm);
  user-select: none;
}

.gh-btn:hover {
  background-color: var(--color-border-muted);
}

.gh-btn:active {
  background-color: var(--color-border-default);
}

.gh-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
  outline-offset: -1px;
}

.gh-btn-primary {
  color: #ffffff;
  background-color: var(--color-success-emphasis);
  border-color: rgba(27, 31, 36, 0.15);
}

.gh-btn-primary:hover {
  background-color: #2c974b;
}

/* Ref (Branch/Tag) Selector Popover */
.ref-selector-wrap {
  position: relative;
}

.ref-selector-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.ref-btn-label {
  font-weight: 600;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dropdown-caret {
  font-size: 11px;
  margin-left: 2px;
  color: var(--color-fg-muted);
}

.ref-popover {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: 300px;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-rest);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.ref-popover-header {
  padding: 8px 10px;
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
}

.ref-popover-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.ref-popover-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-default);
}

.ref-popover-close {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  font-size: 13px;
  color: var(--color-fg-muted);
  border-radius: var(--radius-sm);
}

.ref-popover-close:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.ref-search-wrap {
  margin-bottom: 8px;
}

.ref-search-input {
  width: 100%;
  padding: 5px 8px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-sm);
  outline: none;
}

.ref-search-input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.ref-search-input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.ref-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--color-border-muted);
  margin-top: 4px;
}

.ref-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--color-fg-muted);
  cursor: pointer;
  margin-bottom: -1px;
}

.ref-tab:hover {
  color: var(--color-fg-default);
}

.ref-tab.active {
  color: var(--color-fg-default);
  border-bottom-color: #fd8c73;
  font-weight: 600;
}

.ref-list {
  max-height: 250px;
  overflow-y: auto;
  padding: 4px 0;
}

.ref-item {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--color-fg-default);
  cursor: pointer;
  gap: 8px;
  text-decoration: none;
}

.ref-item:hover, .ref-item.active {
  background-color: var(--color-canvas-subtle);
}

.ref-item.selected {
  font-weight: 600;
}

.ref-item-check {
  width: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-fg-default);
  flex-shrink: 0;
}

.ref-item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ref-item-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 10px;
  margin-left: auto;
}

.ref-empty {
  padding: 16px 12px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 12px;
}

/* Tabs */
.gh-nav-tabs {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 0 24px;
}

.gh-nav-tabs-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.gh-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--color-fg-muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}

.gh-tab:hover {
  color: var(--color-fg-default);
}

.gh-tab.active {
  color: var(--color-fg-default);
  font-weight: 600;
  border-bottom-color: #fd8c73;
}

.gh-tab .counter {
  display: inline-block;
  padding: 0 6px;
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
  border-radius: 20px;
}

/* Main Container */
.gh-container {
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  flex: 1;
}

/* Metric Cards */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.metric-card {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.metric-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.metric-value-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}

.metric-percent {
  font-size: 28px;
  font-weight: 600;
  line-height: 1.1;
  font-family: var(--font-sans);
}

.metric-counts {
  font-size: 13px;
  color: var(--color-fg-muted);
}

/* Progress bar */
.progress-bar-container {
  height: 6px;
  background-color: var(--color-border-muted);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 3px;
}

/* Delta badges */
.delta-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 12px;
  line-height: 14px;
}

.delta-badge.positive {
  color: var(--color-success-fg);
  background-color: var(--color-success-subtle);
}

.delta-badge.negative {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

.delta-badge.neutral {
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
}

/* GitHub Commit Banner */
.commit-banner {
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.commit-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.commit-author-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background-color: var(--color-accent-emphasis);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}

.commit-message {
  font-weight: 600;
  color: var(--color-fg-default);
}

.commit-meta {
  color: var(--color-fg-muted);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.commit-sha-badge {
  font-family: var(--font-mono);
  font-size: 12px;
  background-color: var(--color-neutral-subtle);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--color-accent-fg);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Toolbar & Breadcrumbs */
.file-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 12px;
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--color-fg-muted);
  flex-wrap: wrap;
}

.breadcrumb-item {
  color: var(--color-accent-fg);
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
}

.breadcrumb-item:hover {
  text-decoration: underline;
}

.breadcrumb-separator {
  color: var(--color-fg-muted);
}

.search-box {
  position: relative;
  min-width: 220px;
}

.search-box input {
  width: 100%;
  padding: 5px 10px 5px 30px;
  font-size: 13px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  outline: none;
}

.search-box input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.search-box input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}

.search-icon {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  pointer-events: none;
  z-index: 1;
}

/* File Table */
.gh-box {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.table-wrapper {
  overflow-x: auto;
  max-inline-size: 100%;
}

table.gh-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}

table.gh-table th {
  background-color: var(--color-canvas-subtle);
  color: var(--color-fg-muted);
  font-weight: 600;
  padding: 8px 16px;
  border-bottom: 1px solid var(--color-border-default);
  white-space: nowrap;
  user-select: none;
}

table.gh-table th.sortable {
  cursor: pointer;
}

table.gh-table th.sortable:hover {
  color: var(--color-fg-default);
}

table.gh-table td {
  padding: 8px 16px;
  border-top: 1px solid var(--color-border-muted);
  color: var(--color-fg-default);
  vertical-align: middle;
}

table.gh-table tbody tr:first-child td {
  border-top: none;
}

table.gh-table tbody tr:hover td {
  background-color: var(--color-canvas-subtle);
}

.file-name-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}

.file-link {
  color: var(--color-fg-default);
  text-decoration: none;
  cursor: pointer;
}

.file-link:hover {
  color: var(--color-accent-fg);
  text-decoration: underline;
}

/* Rate Pill */
.rate-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  min-width: 52px;
}

.rate-high {
  color: var(--color-success-fg);
  background-color: var(--color-success-subtle);
}

.rate-medium {
  color: var(--color-attention-fg);
  background-color: var(--color-attention-subtle);
}

.rate-low {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

/* Charts */
.chart-container {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 24px;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}

.chart-title {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.chart-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.svg-chart {
  width: 100%;
  height: 240px;
  overflow: visible;
}

.chart-dot {
  cursor: pointer;
  transition: r 0.2s ease, fill 0.2s ease;
}

.chart-dot:hover {
  r: 6;
  fill: var(--color-accent-fg);
}

/* Tooltip */
.chart-tooltip {
  position: absolute;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  box-shadow: var(--shadow-rest);
  font-size: 12px;
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.15s ease;
  white-space: nowrap;
}

/* Code Viewer */
.blob-wrapper {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.blob-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  color: var(--color-fg-muted);
}

.blob-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.code-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 20px;
}

.code-table td {

fs from 'node:fs';\nimport { fileURLToPath } from 'node:url';\nimport { spawnSync } from 'node:child_process';\nimport {\n  generateCoveragePages,\n  startServer,\n  backfillCommits,\n  createDropinSite,\n  FRAMEWORK_PRESETS,\n  getPreset,\n  generatePresetWorkflow,\n} from './index.js';\nimport type { SupportedFormat } from './types.js';\n\nconst HELP_TEXT = `\ncovpages - Impeccable GitHub-styled Coverage Report for GitHub Pages\n\nUSAGE:\n  covpages [command] [options] [input-files...]\n\nCOMMANDS:\n  generate (default)  Generate coverage static site for GitHub Pages\n  dropin              Generate zero-build drop-in static site (index.html + .nojekyll)\n  backfill            Backfill test coverage across a range of historical git commits\n  presets             View integration guides and workflows for mainstream frameworks\n  docker              Run, build, or pull covpages inside a container (docker/podman)\n  serve               Start a local preview web server\n  init                Create a GitHub Actions workflow for GitHub Pages\n  help                Show this help screen\n\nOPTIONS:\n  -i, --input \u003cpath\u003e      Input coverage file (lcov.info, cobertura.xml, coverage-summary.json)\n  -o, --output \u003cdir\u003e      Output directory for generated site (default: \"covpages-dist\")\n  -f, --format \u003ctype\u003e     Coverage format: lcov | cobertura | json | auto (default: auto)\n  --history \u003cfile\u003e        Path to history JSON file (default: \"\u003coutput\u003e/history.json\")\n  --history-dir \u003cdir\u003e     Directory containing multiple commit reports (for trends)\n  --commit \u003csha\u003e          Commit SHA (defaults to git HEAD)\n  -m, --message \u003cmsg\u003e     Commit message (defaults to git HEAD message)\n  -a, --author \u003cauthor\u003e   Commit author (defaults to git author)\n  -b, --branch \u003cbranch\u003e   Branch name (defaults to git branch)\n  -t, --tag \u003ctag\u003e         Tag name (defaults to git tag if on tag)\n  --base-url \u003curl\u003e        Base URL for subdirectory hosting (e.g. \"/docs/covpages/\")\n  --save-raw              Save normalized raw lcov-\u003csha\u003e.info in history/lcov/\n  --docs                  Target docs/covpages for GitHub Pages deployment\n  --date \u003ciso-date\u003e       Commit date (defaults to git date or now)\n  --title \u003ctitle\u003e         Custom title for report\n  --repo \u003cname\u003e           Repository name\n  --no-source             Exclude embedding source code in report\n  --max-history \u003cnumber\u003e  Maximum number of history points (default: 100)\n  --range \u003cgit-range\u003e     Git revision range for backfill (e.g. HEAD~5..HEAD)\n  -n, --count \u003cnumber\u003e    Number of commits to backfill (default: 5)\n  --test-cmd \u003ccmd\u003e        Custom test command to run for backfill (e.g. \"npm test\")\n  --coverage-file \u003cpath\u003e  Coverage file produced by test command (default: \"coverage/lcov.info\")\n  --framework \u003cname\u003e      Target framework for init/presets (flutter, vitest, jest, rust, python, go, cpp)\n  -p, --port \u003cport\u003e       Port for local preview server (default: 8080)\n  -v, --version           Print version\n  -h, --help              Print help\n\nEXAMPLES:\n  # 1. Zero-build Drop-in: put index.html in gh-pages, then just cp lcov.info!\n  npx covpages dropin gh-pages\n  cp coverage/lcov.info gh-pages/\n\n  # 2. Backfill historical commits to create trend charts immediately\n  npx covpages backfill --range HEAD~10..HEAD --test-cmd \"npm test\"\n\n  # 3. Generate from lcov.info\n  npx covpages coverage/lcov.info\n\n  # 4. View framework integration workflows\n  npx covpages presets flutter\n  npx covpages presets vitest\n`;\n\nexport async function runCli(argv = process.argv.slice(2)): Promise\u003cvoid\u003e {\n  const options = {\n    input: { type: 'string' as const, short: 'i', multiple: true },\n    output: { type: 'string' as const, short: 'o', default: 'covpages-dist' },\n    format: { type: 'string' as const, short: 'f', default: 'auto' },\n    history: { type: 'string' as const },\n    'history-dir': { type: 'string' as const },\n    commit: { type: 'string' as const },\n    message: { type: 'string' as const, short: 'm' },\n    author: { type: 'string' as const, short: 'a' },\n    branch: { type: 'string' as const, short: 'b' },\n    tag: { type: 'string' as const, short: 't' },\n    'base-url': { type: 'string' as const },\n    'save-raw': { type: 'boolean' as const, default: false },\n    docs: { type: 'boolean' as const, default: false },\n    date: { type: 'string' as const },\n    title: { type: 'string' as const },\n    repo: { type: 'string' as const },\n    'no-source': { type: 'boolean' as const, default: false },\n    'max-history': { type: 'string' as const, default: '100' },\n    range: { type: 'string' as const },\n    count: { type: 'string' as const, short: 'n' },\n    'test-cmd': { type: 'string' as const },\n    'coverage-file': { type: 'string' as const },\n    framework: { type: 'string' as const },\n    port: { type: 'string' as const, short: 'p', default: '8080' },\n    version: { type: 'boolean' as const, short: 'v' },\n    help: { type: 'boolean' as const, short: 'h' },\n  };\n\n  let parsed;\n  try {\n    parsed = parseArgs({\n      args: argv,\n      options,\n      allowPositionals: true,\n      strict: false,\n    });\n  } catch (err: any) {\n    console.error(`Error: ${err.message}`);\n    console.log(HELP_TEXT);\n    process.exit(1);\n  }\n\n  const { values, positionals } = parsed;\n\n  if (values.version) {\n    console.log('covpages v0.1.0');\n    return;\n  }\n\n  if (values.help) {\n    console.log(HELP_TEXT);\n    return;\n  }\n\n  const firstArg = positionals[0];\n\n  const strVal = (v: any, fallback?: string): string | undefined =\u003e {\n    if (typeof v === 'string') return v;\n    return fallback;\n  };\n\n  // 1. Drop-in command\n  if (firstArg === 'dropin') {\n    const targetDir = positionals[1] || strVal(values.output, 'gh-pages')!;\n    createDropinSite(targetDir, strVal(values.title, 'Coverage Report'));\n    console.log(`\\n🎉 Zero-build Drop-in site created at: ${path.resolve(targetDir)}/index.html`);\n    console.log('   How to use:');\n    console.log('   1. Put your coverage file (lcov.info) into this directory.');\n    console.log('   2. Push to your \"gh-pages\" branch.');\n    console.log('   3. The page will fetch and parse lcov.info in real time on the client side!\\n');\n    return;\n  }\n\n  // 2. Presets command\n  if (firstArg === 'presets') {\n    const framework = positionals[1] || strVal(values.framework);\n    if (framework) {\n      const preset = getPreset(framework);\n      if (!preset) {\n        console.error(`\\nUnknown framework \"${framework}\". Available presets:`);\n        Object.keys(FRAMEWORK_PRESETS).forEach(k =\u003e console.log(` - ${k} (${FRAMEWORK_PRESETS[k].name})`));\n        console.log('');\n        process.exit(1);\n      }\n      console.log(`\\n📘 Framework Preset: ${preset.name}`);\n      console.log(`   Description:   ${preset.description}`);\n      console.log(`   Test Command:  ${preset.testCmd}`);\n      console.log(`   Coverage File: ${preset.coverageFile}\\n`);\n      console.log('--- Ready-to-use GitHub Actions Workflow (.github/workflows/covpages.yml) ---');\n      console.log(generatePresetWorkflow(framework));\n      return;\n    }\n\n    console.log('\\n🌟 Available Framework Presets:\\n');\n    for (const [key, preset] of Object.entries(FRAMEWORK_PRESETS)) {\n      console.log(`  • ${key.padEnd(10)} : ${preset.name.padEnd(32)} (${preset.testCmd})`);\n    }\n    console.log('\\nRun \"npx covpages presets \u003cframework\u003e\" to view full CI workflow and configuration.\\n');\n    return;\n  }\n\n  // 3. Docker command\n  if (firstArg === 'docker') {\n    const subCmd = positionals[1] || '--help';\n    const restArgs = positionals.slice(2);\n    const __filename = fileURLToPath(import.meta.url);\n    const __dirname = path.dirname(__filename);\n    const dockerScript = path.resolve(__dirname, '../bin/covpages-docker.sh');\n    const result = spawnSync(dockerScript, [subCmd, ...restArgs], {\n      stdio: 'inherit',\n      env: process.env,\n    });\n    process.exit(result.status ?? 0);\n  }\n\n  // 4. Backfill command\n  if (firstArg === 'backfill') {\n    const count = values.count ? parseInt(strVal(values.count)!, 10) : undefined;\n    console.log('\\n⏳ Starting commit backfill process...');\n    try {\n      const result = backfillCommits({\n        range: strVal(values.range),\n        count,\n        testCmd: strVal(values['test-cmd']),\n        coverageFile: strVal(values['coverage-file']),\n        outputDir: strVal(values.output, 'covpages-dist')!,\n        historyFile: strVal(values.history),\n        repoName: strVal(values.repo),\n        title: strVal(values.title),\n      });\n      console.log(`✅ Backfill completed with ${result.commits.length} commits in trend timeline!`);\n    } catch (err: any) {\n      console.error(`\\n❌ Error during backfill: ${err.message}\\n`);\n      process.exit(1);\n    }\n    return;\n  }\n\n  // 4. Init command\n  if (firstArg === 'init') {\n    const framework = strVal(values.framework);\n    const workflowDir = path.resolve('.github/workflows');\n    const workflowPath = path.join(workflowDir, 'covpages.yml');\n    if (!fs.existsSync(workflowDir)) {\n      fs.mkdirSync(workflowDir, { recursive: true });\n    }\n\n    const presetKey = framework && getPreset(framework) ? framework : 'vitest';\n    const workflowContent = generatePresetWorkflow(presetKey, { docs: Boolean(values.docs) });\n\n    fs.writeFileSync(workflowPath, workflowContent, 'utf-8');\n    console.log(`\\n✨ Created GitHub Actions workflow at: ${workflowPath}`);\n    if (values.docs) {\n      console.log('   Configured for GitHub Pages deployment from docs/covpages on main branch!\\n');\n    } else {\n      console.log('   Push to main branch to automatically generate and publish coverage to GitHub Pages!\\n');\n    }\n    return;\n  }\n\n  // 5. Serve command\n  if (firstArg === 'serve') {\n    const targetDir = positionals[1] || strVal(values.output, 'covpages-dist')!;\n    const port = parseInt(strVal(values.port, '8080')!, 10);\n    startServer(targetDir, port);\n    return;\n  }\n\n  // Determine command: if first arg is 'generate', shift it\n  const remainingPositionals = firstArg === 'generate' \n    ? positionals.slice(1) \n    : positionals;\n\n  // Gather inputs\n  const inputs: string[] = [];\n  if (values.input && Array.isArray(values.input)) {\n    for (const item of values.input) {\n      if (typeof item === 'string') inputs.push(item);\n    }\n  }\n  if (remainingPositionals.length \u003e 0) {\n    inputs.push(...remainingPositionals);\n  }\n\n  // Default input if none provided\n  if (inputs.length === 0) {\n    const candidates = [\n      'coverage/lcov.info',\n      'coverage/coverage-final.json',\n      'coverage/coverage-summary.json',\n      'coverage/cobertura-coverage.xml',\n      'lcov.info',\n    ];\n    for (const cand of candidates) {\n      if (fs.existsSync(cand)) {\n        inputs.push(cand);\n        break;\n      }\n    }\n  }\n\n  if (inputs.length === 0) {\n    console.error('Error: No coverage report file specified and default candidates not found.');\n    console.log('Please provide a coverage file (e.g. npx covpages coverage/lcov.info)\\n');\n    process.exit(1);\n  }\n\n  console.log(`\\n🔍 Parsing coverage report from: ${inputs.join(', ')}`);\n\n  const outputDir = values.docs && values.output === 'covpages-dist'\n    ? 'docs/covpages'\n    : strVal(values.output, 'covpages-dist')!;\n\n  try {\n    const result = generateCoveragePages({\n      inputs,\n      outputDir,\n      format: (strVal(values.format, 'auto') as SupportedFormat),\n      historyFile: strVal(values.history),\n      historyDir: strVal(values['history-dir']),\n      commitSha: strVal(values.commit),\n      commitMessage: strVal(values.message),\n      commitAuthor: strVal(values.author),\n      commitDate: strVal(values.date),\n      branch: strVal(values.branch),\n      tag: strVal(values.tag),\n      baseUrl: strVal(values['base-url']),\n      saveRaw: Boolean(values['save-raw']),\n      title: strVal(values.title),\n      repoName: strVal(values.repo),\n      includeSource: !values['no-source'],\n      maxHistoryCommits: parseInt(strVal(values['max-history'], '100')!, 10),\n    });\n\n    const linesPct = result.summary.lines.pct;\n    const fnPct = result.summary.functions.pct;\n    const brPct = result.summary.branches.pct;\n\n    console.log(`\\n✅ covpages generated successfully!`);\n    console.log(`   Output: ${path.resolve(outputDir)}/index.html`);\n    console.log(`   Lines:     ${linesPct}% (${result.summary.lines.covered}/${result.summary.lines.total})`);\n    console.log(`   Functions: ${fnPct}% (${result.summary.functions.covered}/${result.summary.functions.total})`);\n    console.log(`   Branches:  ${brPct}% (${result.summary.branches.covered}/${result.summary.branches.total})`);\n    console.log(`   Commits in trend: ${result.commits.length}`);\n\n    if (result.delta) {\n      const sign = result.delta.linesPct \u003e= 0 ? '+' : '';\n      console.log(`   Delta:     ${sign}${result.delta.linesPct}%\\n`);\n    } else {\n      console.log('');\n    }\n  } catch (err: any) {\n    console.error(`\\n❌ Error generating covpages: ${err.message}\\n`);\n    process.exit(1);\n  }\n}\n\n// Auto-run if executed directly\nif (process.argv[1] && (process.argv[1].endsWith('covpages.js') || process.argv[1].endsWith('cli.ts') || process.argv[1].endsWith('cli.js'))) {\n  runCli();\n}\n"},"src/index.ts":{"path":"src/index.ts","lines":{"total":170,"covered":133,"skipped":37,"pct":78.24},"functions":{"total":2,"covered":2,"skipped":0,"pct":100},"branches":{"total":27,"covered":18,"skipped":9,"pct":66.67},"lineDetails":{"1":{"hits":1},"38":{"hits"  } from './core/git.js';\nimport { aggregateCoverage } from './core/aggregator.js';\nimport {\n  createCommitHistoryEntry,\n  buildTrends,\n  loadHistory,\n  saveHistory,\n  appendOrUpdateCommit,\n  calculateDelta,\n  extractRefs,\n  saveRefs,\n} from './core/history.js';\nimport { normalizeLcov, GITATTRIBUTES_CONTENT } from './core/lcov-normalizer.js';\nimport { generateBadgeSvg, getBadgeFileName } from './core/badge.js';\nimport { renderIndexHtml, render404Html } from './templates/index.html.js';\n\nexport * from './types.js';\nexport * from './parsers/index.js';\nexport * from './core/aggregator.js';\nexport * from './core/history.js';\nexport * from './core/git.js';\nexport * from './core/backfill.js';\nexport * from './core/presets.js';\nexport * from './core/lcov-normalizer.js';\nexport * from './core/badge.js';\nexport * from './server.js';\nexport { renderDropinHtml } from './templates/index.html.js';\n\nexport function createDropinSite(outputDir = 'gh-pages', title = 'Coverage Report'): void {\n  const dir = path.resolve(outputDir);\n  if (!fs.existsSync(dir)) {\n    fs.mkdirSync(dir, { recursive: true });\n  }\n  const rendered = renderIndexHtml(null);\n  fs.writeFileSync(path.join(dir, 'index.html'), rendered.html, 'utf-8');\n  fs.writeFileSync(path.join(dir, '.nojekyll'), '', 'utf-8');\n  fs.writeFileSync(path.join(dir, '.gitattributes'), GITATTRIBUTES_CONTENT, 'utf-8');\n  fs.writeFileSync(path.join(dir, 'badge.svg'), generateBadgeSvg(100), 'utf-8');\n  fs.writeFileSync(path.join(dir, '404.html'), render404Html(), 'utf-8');\n}\n\n\nexport function generateCoveragePages(options: GenerateOptions): CovpagesData {\n  const outputDir = path.resolve(options.outputDir || './covpages-dist');\n  const rootDir = options.rootDir ? path.resolve(options.rootDir) : process.cwd();\n  const maxHistory = options.maxHistoryCommits || 100;\n\n  if (!fs.existsSync(outputDir)) {\n    fs.mkdirSync(outputDir, { recursive: true });\n  }\n\n  // 1. Resolve commit info for current run\n  const currentCommit = resolveCommitInfo({\n    cwd: rootDir,\n    sha: options.commitSha,\n    message: options.commitMessage,\n    author: options.commitAuthor,\n    date: options.commitDate,\n    branch: options.branch,\n    tag: options.tag,\n  });\n\n  // 2. Load existing history\n  const historyPath = options.historyFile \n    ? path.resolve(options.historyFile) \n    : path.join(outputDir, 'history.json');\n  \n  let commitsHistory = loadHistory(historyPath);\n\n  // If a historyDir is provided, load and parse any historical coverage files\n  if (options.historyDir && fs.existsSync(options.historyDir)) {\n    const historyFiles = fs.readdirSync(options.historyDir)\n      .filter((f: string) =\u003e !f.startsWith('.') && (f.endsWith('.lcov') || f.endsWith('.info') || f.endsWith('.xml') || f.endsWith('.json')))\n      .sort();\n\n    for (const hFile of historyFiles) {\n      const fullHPath = path.join(options.historyDir, hFile);\n      const parsedHFiles = parseCoverageFile(fullHPath, {\n        format: options.format,\n        rootDir,\n        includeSource: false,\n      });\n      const aggregatedH = aggregateCoverage(parsedHFiles);\n\n      // Extract metadata from filename if possible, e.g. \u003csha\u003e_\u003cdate\u003e_\u003cbranch\u003e.lcov\n      const baseName = path.basename(hFile, path.extname(hFile));\n      const parts = baseName.split('_');\n      const hSha = parts[0] || `hist_${baseName}`;\n      const hDate = parts[1] || new Date(fs.statSync(fullHPath).mtime).toISOString();\n      const hBranch = parts[2] || currentCommit.branch;\n\n      const hCommitInfo = {\n        sha: hSha,\n        shortSha: hSha.slice(0, 7),\n        message: `Coverage run ${baseName}`,\n        author: 'automated',\n        date: hDate,\n        branch: hBranch,\n      };\n\n      const hEntry = createCommitHistoryEntry(\n        hCommitInfo,\n        aggregatedH.summary,\n        aggregatedH.folders,\n        aggregatedH.files\n      );\n\n      commitsHistory = appendOrUpdateCommit(commitsHistory, hEntry, maxHistory);\n    }\n  }\n\n  // 3. Process primary input coverage file(s)\n  let mergedFiles: Record\u003cstring, FileCoverage\u003e = {};\n\n  const inputPaths = options.inputs && options.inputs.length \u003e 0 \n    ? options.inputs \n    : ['coverage/lcov.info'];\n\n  for (const inputPath of inputPaths) {\n    const resolvedInput = path.resolve(inputPath);\n    if (!fs.existsSync(resolvedInput)) {\n      throw new Error(`Coverage input file not found: ${resolvedInput}`);\n    }\n\n    const parsed = parseCoverageFile(resolvedInput, {\n      format: options.format,\n      rootDir,\n      includeSource: options.includeSource ?? true,\n    });\n\n    mergedFiles = { ...mergedFiles, ...parsed };\n  }\n\n  // 4. Hierarchical aggregation\n  const aggregated = aggregateCoverage(mergedFiles);\n\n  // 5. Create history entry for the current commit\n  const currentEntry = createCommitHistoryEntry(\n    currentCommit,\n    aggregated.summary,\n    aggregated.folders,\n    aggregated.files\n  );\n\n  // Find previous commit before appending current\n  const existingPrevious = commitsHistory.length \u003e 0 \n    ? commitsHistory[commitsHistory.length - 1] \n    : undefined;\n\n  const previousCommit = existingPrevious?.commit;\n  const delta = calculateDelta(aggregated.summary, existingPrevious?.summary);\n\n  // Append or update current commit\n  commitsHistory = appendOrUpdateCommit(commitsHistory, currentEntry, maxHistory);\n\n  // 6. Build Trends across all historical commits (overall, folder, file)\n  const trends = buildTrends(commitsHistory);\n\n  // 7. Save updated history and refs\n  saveHistory(historyPath, commitsHistory);\n  const refs = extractRefs(commitsHistory);\n  saveRefs(path.join(outputDir, 'refs.json'), refs);\n\n  // 8. Assemble CovpagesData\n  const repoName = options.repoName || path.basename(rootDir) || 'coverage';\n  const title = options.title || 'Coverage Report';\n\n  const covpagesData: CovpagesData = {\n    title,\n    repoName,\n    baseUrl: options.baseUrl,\n    generatedAt: new Date().toISOString(),\n    currentCommit,\n    previousCommit,\n    delta,\n    summary: aggregated.summary,\n    folders: aggregated.folders,\n    files: aggregated.files,\n    folderChildren: aggregated.folderChildren,\n    commits: commitsHistory,\n    refs,\n    trends,\n  };\n\n  // 9. Render and write HTML, JS, CSS, JSON, .nojekyll, and .gitattributes\n  const rendered = renderIndexHtml(covpagesData);\n\n  fs.writeFileSync(path.join(outputDir, 'index.html'), rendered.html, 'utf-8');\n  fs.writeFileSync(path.join(outputDir, 'covpages-data.json'), JSON.stringify(covpagesData, null, 2), 'utf-8');\n  fs.writeFileSync(path.join(outputDir, 'covpages-data.js'), rendered.dataJs, 'utf-8');\n  fs.writeFileSync(path.join(outputDir, '.nojekyll'), '', 'utf-8');\n  fs.writeFileSync(path.join(outputDir, '.gitattributes'), GITATTRIBUTES_CONTENT, 'utf-8');\n  fs.writeFileSync(path.join(outputDir, 'badge.svg'), generateBadgeSvg(aggregated.summary.lines.pct), 'utf-8');\n  fs.writeFileSync(path.join(outputDir, '404.html'), render404Html(), 'utf-8');\n\n  // 10. Generate scoped badges in badges/ directory for folders, files, and branches\n  const badgesDir = path.join(outputDir, 'badges');\n  if (!fs.existsSync(badgesDir)) {\n    fs.mkdirSync(badgesDir, { recursive: true });\n  }\n  fs.writeFileSync(path.join(badgesDir, 'overall.svg'), generateBadgeSvg(aggregated.summary.lines.pct, 'coverage'), 'utf-8');\n\n  if (currentCommit.branch) {\n    const bFile = getBadgeFileName('branch', currentCommit.branch);\n    fs.writeFileSync(path.join(badgesDir, bFile), generateBadgeSvg(aggregated.summary.lines.pct, currentCommit.branch), 'utf-8');\n  }\n  if (currentCommit.tag) {\n    const tFile = getBadgeFileName('tag', currentCommit.tag);\n    fs.writeFileSync(path.join(badgesDir, tFile), generateBadgeSvg(aggregated.summary.lines.pct, currentCommit.tag), 'utf-8');\n  }\n  if (currentCommit.shortSha) {\n    fs.writeFileSync(path.join(badgesDir, `commit-${currentCommit.shortSha}.svg`), generateBadgeSvg(aggregated.summary.lines.pct, currentCommit.shortSha), 'utf-8');\n  }\n\n  for (const [fPath, fCov] of Object.entries(aggregated.folders)) {\n    if (!fPath) continue;\n    const fFile = getBadgeFileName('folder', fPath);\n    fs.writeFileSync(path.join(badgesDir, fFile), generateBadgeSvg(fCov.lines.pct, fPath), 'utf-8');\n  }\n\n  for (const [filePath, fileCov] of Object.entries(aggregated.files)) {\n    const fileFile = getBadgeFileName('file', filePath);\n    fs.writeFileSync(path.join(badgesDir, fileFile), generateBadgeSvg(fileCov.lines.pct, path.basename(filePath)), 'utf-8');\n  }\n\n  // 10. Normalize and write lcov.info if an LCOV input file exists\n  for (const inp of inputPaths) {\n    if (inp.endsWith('.info') || inp.endsWith('.lcov')) {\n      try {\n        const rawLcov = fs.readFileSync(path.resolve(inp), 'utf-8');\n        const normalized = normalizeLcov(rawLcov);\n        fs.writeFileSync(path.join(outputDir, 'lcov.info'), normalized, 'utf-8');\n\n        if (options.saveRaw) {\n          const rawDir = path.join(outputDir, 'history', 'lcov');\n          if (!fs.existsSync(rawDir)) {\n            fs.mkdirSync(rawDir, { recursive: true });\n          }\n          fs.writeFileSync(path.join(rawDir, `lcov-${currentCommit.shortSha}.info`), normalized, 'utf-8');\n        }\n      } catch {}\n      break;\n    }\n  }\n\n  return covpagesData;\n}\n"},"src/server.ts":{"path":"src/server.ts","lines":{"total":64,"covered":12,"skipped":52,"pct":18.75},"functions":{"total":1,"covered":0,"skipped":1,"pct":0},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"1":{"hits":1},"5":{"hits":1},"6":{"hits":1},"7":{"hits":1},"8":{"hits":1},"9":{"hits":1},"10":{"hits":1},"11":{"hits":1},"12":{"hits":1},"13":{"hits":1},"14":{"hits":1},"16":{"hits":1},"17":{"hits":0},"19":{"hits":0},"20":{"hits":0},"21":{"hits":0},"23":{"hits":0},"24":{"hits":0},"25" m '../types.js';\n\nfunction calcPct(covered: number, total: number): number {\n  if (total === 0) return 100;\n  return Math.round((covered / total) * 10000) / 100;\n}\n\nexport function aggregateCoverage(files: Record\u003cstring, FileCoverage\u003e): CoverageReport & {\n  folderChildren: Record\u003cstring, { subfolders: string[]; files: string[] }\u003e;\n} {\n  const folders: Record\u003cstring, FolderCoverage\u003e = {};\n  const folderChildren: Record\u003cstring, { subfolders: Set\u003cstring\u003e; files: string[] }\u003e = {};\n\n  const ensureFolder = (fPath: string) =\u003e {\n    if (!folders[fPath]) {\n      const parts = fPath ? fPath.split('/') : [];\n      const name = parts.length \u003e 0 ? parts[parts.length - 1] : 'root';\n      folders[fPath] = {\n        path: fPath,\n        name,\n        lines: { total: 0, covered: 0, skipped: 0, pct: 100 },\n        functions: { total: 0, covered: 0, skipped: 0, pct: 100 },\n        branches: { total: 0, covered: 0, skipped: 0, pct: 100 },\n        filesCount: 0,\n        foldersCount: 0,\n      };\n      folderChildren[fPath] = {\n        subfolders: new Set(),\n        files: [],\n      };\n    }\n  };\n\n  ensureFolder(''); // root folder\n\n  // First pass: add files to their immediate parent and all ancestor folders\n  for (const [filePath, fileCov] of Object.entries(files)) {\n    const parts = filePath.split('/');\n    const dirParts = parts.slice(0, -1);\n    const immediateDir = dirParts.join('/');\n\n    // Ensure all ancestor directories exist\n    let currentDir = '';\n    ensureFolder('');\n\n    for (let i = 0; i \u003c dirParts.length; i++) {\n      const nextDir = dirParts.slice(0, i + 1).join('/');\n      ensureFolder(nextDir);\n      folderChildren[currentDir].subfolders.add(nextDir);\n      currentDir = nextDir;\n    }\n\n    // Add file to its immediate directory\n    folderChildren[immediateDir].files.push(filePath);\n\n    // Roll up metrics into all ancestor folders (including root)\ deterministic, sorted output.\n * This guarantees maximal Git delta compression across consecutive commits.\n */\nexport function normalizeLcov(content: string): string {\n  if (!content || !content.trim()) return '';\n\n  const records: { sf: string; lines: string[] }[] = [];\n  const rawLines = content.split(/\\r?\\n/);\n  let currentSf = '';\n  let currentLines: string[] = [];\n\n  for (const line of rawLines) {\n    const trimmed = line.trim();\n    if (!trimmed) continue;\n    if (trimmed.startsWith('SF:')) {\n      currentSf = trimmed.slice(3).trim();\n      currentLines = [trimmed];\n    } else if (trimmed === 'end_of_record') {\n      currentLines.push(trimmed);\n      if (currentSf) {\n        records.push({ sf: currentSf, lines: currentLines });\n      }\n      currentSf = '';\n      currentLines = [];\n    } else {\n      if (currentLines.length \u003e 0) {\n        currentLines.push(trimmed);\n      }\n    }\n  }\n\n  // Sort file records alphabetically by path\n  records.sort((a, b) =\u003e a.sf.localeCompare(b.sf));\n\n  // Sort internal lines per record deterministically\n  const output: string[] = [];\n  for (const rec of records) {\n    const fnLines: string[] = [];\n    const fndaLines: string[] = [];\n    const brdaLines: string[] = [];\n    const daLines: string[] = [];\n    let fnf = '';\n    let fnh = '';\n    let brf = '';\n    let brh = '';\n    let lf = '';\n    let lh = '';\n\n    for (const l of rec.lines) {\n      if (l.startsWith('SF:') || l === 'end_of_record') continue;\n      if (l.startsWith('FN:')) fnLines.push(l);\n      else if (l.startsWith('FNDA:')) fndaLines.push(l);\n      else if (l.startsWith('FNF:')) fnf = l;\n      else if (l.startsWith('FNH:')) fnh = l;\n      else if (l.startsWith('BRDA:')) brdaLines.push(l);\n      else if (l.startsWith('BRF:')) brf = l;\n      else if (l.startsWith('BRH:')) brh = l;\n      else if (l.startsWith('DA:')) daLines.push(l);\n      else if (l.startsWith('LF:')) lf = l;\n      else if (l.startsWith('LH:')) lh = l;\n    }\n\n    // Sort FN by line number\n    fnLines.sort((a, b) =\u003e {\n      const lineA = parseInt(a.slice(3).split(',')[0], 10) || 0;\n      const lineB = parseInt(b.slice(3).split(',')[0], 10) || 0;\n      return lineA - lineB;\n    });\n\n    // Sort FNDA by function name\n    fndaLines.sort((a, b) =\u003e a.localeCompare(b));\n\n    // Sort BRDA by line, block, branch\n    brdaLines.sort((a, b) =\u003e {\n      const partsA = a.slice(5).split(',').map(Number);\n      const partsB = b.slice(5).split(',').map(Number);\n      for (let i = 0; i \u003c Math.min(partsA.length, partsB.length); i++) {\n        if (partsA[i] !== partsB[i]) return partsA[i] - partsB[i];\n      }\n      return 0;\n    });\n\n    // Sort DA numerically by line number\n    daLines.sort((a, b) =\u003e {\n      const lineA = parseInt(a.slice(3).split(',')[0], 10) || 0;\n      const lineB = parseInt(b.slice(3).split(',')[0], 10) || 0;\n      return lineA - lineB;\n    });\n\n    output.push(`SF:${rec.sf}`);\n    output.push(...fnLines);\n    output.push(...fndaLines);\n    if (fnf) output.push(fnf);\n    if (fnh) output.push(fnh);\n    output.push(...brdaLines);\n    if (brf) output.push(brf);\n    if (brh) output.push(brh);\n    output.push(...daLines);\n    if (lf) output.push(lf);\n    if (lh) output.push(lh);\n    output.push('end_of_record');\n  }\n\n  return output.join('\\n') + '\\n';\n}\n\n/**\n * Standard .gitattributes content for GitHub Pages and coverage directories\n * to guarantee optimal delta compression and LF normalization in git packfiles.\n */\nexport const GITATTRIBUTES_CONTENT = `# Covpages Git Packfile Optimization\n# Forces text mode and LF line endings to maximize delta compression across commits\n*.info text eol=lf delta\n*.lcov text eol=lf delta\n*.json text eol=lf delta\n*.js text eol=lf delta\n*.html text eol=lf delta\n`;\n"},"src/core/presets.ts":{"path":"src/core/presets.ts","lines":{"total":84,"covered":78,"skipped":6,"pct":92.86},"fu alizeFilePath(rawFilename, rootDir);\n\n    const lineDetails: Record\u003cnumber, LineCoverageDetail\u003e = {};\n    const functionDetails: FunctionCoverageDetail[] = [];\n\n    // Parse methods\n    const methodRegex = /\u003cmethod\\b([^\u003e]*?)\u003e([\\s\\S]*?)\u003c\\/method\u003e/gi;\n    let methodMatch: RegExpExecArray | null;\n    while ((methodMatch = methodRegex.exec(classBody)) !== null) {\n      const mAttrs = methodMatch[1];\n      const mBody = methodMatch[2];\n      const nameMatch = /name=[\"']([^\"']+)[\"']/i.exec(mAttrs);\n      const lineMatch = /line=[\"'](\\d+)[\"']/i.exec(mAttrs);\n      const hitsMatch = /hits=[\"'](\\d+)[\"']/i.exec(mAttrs);\n\n      let hits = hitsMatch ? parseInt(hitsMatch[1], 10) : 0;\n      let line = lineMatch ? parseInt(lineMatch[1], 10) : 0;\n\n      // Check inner lines if method hits weren't on the tag\n      if (!hitsMatch) {\n        const mLineHits = /\u003cline\\b[^\u003e]*?hits=[\"'](\\d+)[\"']/gi;\n        let lh;\n        while ((lh = mLineHits.exec(mBody)) !== null) {\n          hits += parseInt(lh[1], 10) || 0;\n        }\n      }\n\n      if (nameMatch) {\n        functionDetails.push({\n          name: nameMatch[1],\n          line,\n          hits,\n        });\n      }\n    }\n\n    // Parse lines\n    const lineTagRegex = /\u003cline\\b([^\u003e]*?)(?:\\/?\u003e|\u003e[\\s\\S]*?\u003c\\/line\u003e)/gi;\n    let lineTagMatch: RegExpExecArray | null;\n    let branchesFound = 0;\n    let branchesHit = 0;\n\n    while ((lineTagMatch = lineTagRegex.exec(classBody)) !== null) {\n      const lAttrs = lineTagMatch[1];\n      const numMatch = /number=[\"'](\\d+)[\"']/i.exec(lAttrs);\n      const hitsMatch = /hits=[\"'](\\d+)[\"']/i.exec(lAttrs);\n      const isBranchMatch = /branch=[\"']true[\"']/i.exec(lAttrs);\n      const condMatch = /condition-coverage=[\"']\\d+%\\s*\\((\\d+)\\/(\\d+)\\)[\"']/i.exec(lAttrs);\n\n      if (!numMatch) continue;\n      const lineNum = parseInt(numMatch[1], 10);\n      const hits = hitsMatch ? parseInt(hitsMatch[1], 10) : 0;\n\n      if (lineDetails[lineNum]) {\n        lineDetails[lineNum].hits = Math.max(lineDetails[lineNum].hits, hits);\n        continue;\n      }\n\n      let branches: { total: number; taken: number } | undefined;\n      if (isBranchMatch || condMatch) {\n        if (condMatch) {\n          const taken = parseInt(condMatch[1], 10);\n          const total = parseInt(condMatch[2], 10);\n          branches = { taken, total };\n          branchesFound += total;\n          branchesHit += taken;\n        } else {\n          branches = { total: 1, taken: hits \u003e 0 ? 1 : 0 };\n          branchesFound += 1;\n          if (hits \u003e 0) branchesHit += 1;\n        }\n      }\n\n      lineDetails[lineNum] = {\n        hits,\n        branches,\n      };\n    }\n\n    const lineNums = Object.keys(lineDetails).map(Number);\n    const linesFound = lineNums.length;\n    const linesHit = lineNums.filter((l) =\u003e lineDetails[l].hits \u003e 0).length;\n\n    const functionsFound = functionDetails.length;\n    const functionsHit = functionDetails.filter((f) =\u003e f.hits \u003e 0).length;\n\n    let sourceCode: string | undefined;\n    if (includeSource) {\n      const resolvedPath = rootDir ? path.resolve(rootDir, normalizedPath) : path.resolve(normalizedPath);\n      try {\n        if (fs.existsSync(resolvedPath)) {\n          sourceCode = fs.readFileSync(resolvedPath, 'utf-8');\n        }\n      } catch {\n        // ignore\n      }\n    }\n\n    files[normalizedPath] = {\n      path: normalizedPath,\n      lines: {\n        total: linesFound,\n        covered: linesHit,\n        skipped: Math.max(0, linesFound - linesHit),\n        pct: calcPct(linesHit, linesFound),\n      },\n      functions: {\n        total: functionsFound,\n        covered: functionsHit,\n        skipped: Math.max(0, functionsFound - functionsHit),\n        pct: calcPct(functionsHit, functionsFound),\n      },\n      branches: {\n        total: branchesFound,\n        covered: branchesHit,\n        skipped: Math.max(0, branchesFound - branchesHit),\n        pct: calcPct(branchesHit, branchesFound),\n      },\n      lineDetails,\n      functionDetails: functionDetails.length \u003e 0 ? functionDetails : undefined,\n      sourceCode,\n    };\n  }\n\n  return files;\n}\n"},"src/parsers/index.ts":{"path":"src/parsers/index.ts","lines":{"total":40,"covered":35,"skipped":5,"pct":87.5},"functions":{"total":2,"covered":2,"skipped":0,"pct":100},"branches":{"total":30,"covered":25,"skipped":5,"pct":83.33},"lineDetails":{"1":{"hits":1},"7":{"hits":1,"branches":{"total":1,"taken":1}},"8":{"hits":18},"9":{"hits":18,"branches":{"total":3,"taken":3}},"10":{"hits":12},"11":{"hits":12,"branches":{"total":2,"taken":2}},"12":{"hits":18,"branches":{"total":4,"taken":4}},"13":{"hits":2},"14":{"hits":2,"branches":{"total":1,"taken":1}},"15":{"hits":8,"branches":{"total":1,"taken":1}},"16":{"hits":2},"17":{"hits":2},"20":{"hits":2},"21":{"hits":18,"branches":{"total":4,"taken":4}},"22":{"hits":1},"23":{"hits":1},"24":{"hits":18,"branches":{"total":4,"taken":2}},"25":{"hits":1},"26":{"hits":1,"branches":{"total":1,"taken":0}},"27":{"hits":18,"branches":{"total":1,"taken":0}},"28":{"hits":0},"29":{"hits":0},"32":{"hits":0},"33":{"hits":0},"35":{"hits":1,"branches":{"total":1,"taken":1}},"36":{"hits":13},"37":{"hits":13,"branches":{"total":2,"taken":1}},"38":{"hits":0},"39":{"hits":13},"41":{"hits":13},"42":{"hits":13,"branches":{"total":1,"taken":1}},"43":{"hits":13,"branches":{"total":1,"taken":1}},"44":{"hits":1},"45":{"hits":13,"branches":{"total":1,"taken":1}},"46":{"hits":1},"47":{"hits":13,"branches":{"total":1,"taken":1}},"48":{"hits":13,"branches":{"total":1,"taken":1}},"49":{"hits":11},"50":{"hits":13},"51":{"hits":13}},"functionDetails":[{"name":"detectFormat","line":7,"hits":18},{"name":"parseCoverageFile","line":35,"hits":13}],"sourceCode":"import fs from 'node:fs';\nimport type { FileCoverage, SupportedFormat, ParseOptions c/table\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \\`;\n  }\n\n  // Render Dedicated Trends Tab\n  function renderTrendsTab() {\n    const overallTrends = data.trends?.overall || [];\n    const folderKeys = Object.keys(data.trends?.folders || {}).filter(Boolean).sort();\n    const fileKeys = Object.keys(data.trends?.files || {}).sort();\n\n    let targetPoints = overallTrends;\n    let targetTitle = 'Overall Repository Coverage Trend';\n\n    if (state.trendScope === 'folder' && state.trendTarget) {\n      targetPoints = data.trends?.folders?.[state.trendTarget] || [];\n      targetTitle = \\`Folder Coverage Trend: \\${state.trendTarget}\\`;\n    } else if (state.trendScope === 'file' && state.trendTarget) {\n      targetPoints = data.trends?.files?.[state.trendTarget] || [];\n      targetTitle = \\`File Coverage Trend: \\${state.trendTarget}\\`;\n    }\n\n    const folderOptions = folderKeys.map(k =\u003e \\`\u003coption value=\"\\${k}\" \\${state.trendScope === 'folder' && state.trendTarget === k ? 'selected' : ''}\u003e\\${escapeHtml(k)}\u003c/option\u003e\\`).join('');\n    const fileOptions = fileKeys.map(k =\u003e \\`\u003coption value=\"\\${k}\" \\${state.trendScope === 'file' && state.trendTarget === k ? 'selected' : ''}\u003e\\${escapeHtml(k)}\u003c/option\u003e\\`).join('');\n\n    return \\`\n      \u003cdiv style=\"margin-bottom: 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;\"\u003e\n        \u003cdiv style=\"display:flex; align-items:center; gap:8px; flex-wrap:wrap;\"\u003e\n          \u003cspan style=\"font-weight:600; font-size:14px;\"\u003eScope:\u003c/span\u003e\n          \u003cbutton class=\"gh-btn \\${state.trendScope === 'overall' ? 'gh-btn-primary' : ''}\" data-scope=\"overall\"\u003eRepository Overall\u003c/button\u003e\n          \u003cbutton class=\"gh-btn \\${state.trendScope === 'folder' ? 'gh-btn-primary' : ''}\" data-scope=\"folder\"\u003eBy Folder\u003c/button\u003e\n "lines":{"total":1,"covered":1,"skipped":0,"pct":100},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"1":{"hits":1}},"sourceCode":"export const STYLES_CSS = `\n/* Primer-inspired GitHub theme design tokens */\n:root {\n  --font-sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Noto Sans\", Helvetica, Arial, sans-serif;\n  --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n\n  --color-canvas-default: #ffffff;\n  --color-canvas-subtle: #f6f8fa;\n  --color-canvas-inset: #f6f8fa;\n  --color-border-default: #d0d7de;\n  --color-border-muted: #d8dee4;\n  --color-fg-default: #1f2328;\n  --color-fg-muted: #656d76;\n  --color-fg-subtle: #6e7781;\n  --color-accent-fg: #0969da;\n  --color-accent-emphasis: #0969da;\n  --color-accent-subtle: #ddf4ff;\n  --color-success-fg: #1a7f37;\n  --color-success-emphasis: #1f883d;\n  --color-success-subtle: #dafbe1;\n  --color-danger-fg: #cf222e;\n  --color-danger-emphasis: #cf222e;\n  --color-danger-subtle: #ffebe9;\n  --color-attention-fg: #9a6700;\n  --color-attention-emphasis: #bf8700;\n  --color-attention-subtle: #fff8c5;\n  --color-neutral-subtle: rgba(234, 238, 242, 0.5);\n\n  --chart-grid: #eaeef2;\n  --chart-line: #0969da;\n  --chart-fill: rgba(9, 105, 218, 0.08);\n\n  --radius-sm: 4px;\n  --radius-md: 6px;\n  --radius-lg: 8px;\n  --shadow-sm: 0 1px 0 rgba(27, 31, 36, 0.04);\n  --shadow-rest: 0 1px 3px rgba(31, 35, 40, 0.12), 0 1px 2px rgba(31, 35, 40, 0.14);\n}\n\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --color-canvas-default: #0d1117;\n    --color-canvas-subtle: #161b22;\n    --color-canvas-inset: #010409;\n    --color-border-default: #30363d;\n    --color-border-muted: #21262d;\n    --color-fg-default: #e6edf3;\n    --color-fg-muted: #848d97;\n    --color-fg-subtle: #6e7681;\n    --color-accent-fg: #2f81f7;\n    --color-accent-emphasis: #1f6feb;\n    --color-accent-subtle: rgba(56, 139, 253, 0.15);\n    --color-success-fg: #3fb950;\n    --color-success-emphasis: #238636;\n    --color-success-subtle: rgba(46, 160, 67, 0.15);\n    --color-danger-fg: #f85149;\n    --color-danger-emphasis: #da3633;\n    --color-danger-subtle: rgba(248, 81, 73, 0.15);\n    --color-attention-fg: #d29922;\n    --color-attention-emphasis: #9e6a03;\n    --color-attention-subtle: rgba(187, 128, 9, 0.15);\n    --color-neutral-subtle: rgba(110, 118, 129, 0.1);\n\n    --chart-grid: #21262d;\n    --chart-line: #2f81f7;\n    --chart-fill: rgba(47, 129, 247, 0.12);\n  }\n}\n\n:root[data-theme=\"dark\"] {\n  --color-canvas-default: #0d1117;\n  --color-canvas-subtle: #161b22;\n  --color-canvas-inset: #010409;\n  --color-border-default: #30363d;\n  --color-border-muted: #21262d;\n  --color-fg-default: #e6edf3;\n  --color-fg-muted: #848d97;\n  --color-fg-subtle: #6e7681;\n  --color-accent-fg: #2f81f7;\n  --color-accent-emphasis: #1f6feb;\n  --color-accent-subtle: rgba(56, 139, 253, 0.15);\n  --color-success-fg: #3fb950;\n  --color-success-emphasis: #238636;\n  --color-success-subtle: rgba(46, 160, 67, 0.15);\n  --color-danger-fg: #f85149;\n  --color-danger-emphasis: #da3633;\n  --color-danger-subtle: rgba(248, 81, 73, 0.15);\n  --color-attention-fg: #d29922;\n  --color-attention-emphasis: #9e6a03;\n  --color-attention-subtle: rgba(187, 128, 9, 0.15);\n  --color-neutral-subtle: rgba(110, 118, 129, 0.1);\n\n  --chart-grid: #21262d;\n  --chart-line: #2f81f7;\n  --chart-fill: rgba(47, 129, 247, 0.12);\n}\n\n:root[data-theme=\"light\"] {\n  --color-canvas-default: #ffffff;\n  --color-canvas-subtle: #f6f8fa;\n  --color-canvas-inset: #f6f8fa;\n  --color-border-default: #d0d7de;\n  --color-border-muted: #d8dee4;\n  --color-fg-default: #1f2328;\n  --color-fg-muted: #656d76;\n  --color-fg-subtle: #6e7781;\n  --color-accent-fg: #0969da;\n  --color-accent-emphasis: #0969da;\n  --color-accent-subtle: #ddf4ff;\n  --color-success-fg: #1a7f37;\n  --color-success-emphasis: #1f883d;\n  --color-success-subtle: #dafbe1;\n  --color-danger-fg: #cf222e;\n  --color-danger-emphasis: #cf222e;\n  --color-danger-subtle: #ffebe9;\n  --color-attention-fg: #9a6700;\n  --color-attention-emphasis: #bf8700;\n  --color-attention-subtle: #fff8c5;\n  --color-neutral-subtle: rgba(234, 238, 242, 0.5);\n\n  --chart-grid: #eaeef2;\n  --chart-line: #0969da;\n  --chart-fill: rgba(9, 105, 218, 0.08);\n}\n\n*, *::before, *::after {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  padding: 0;\n  font-family: var(--font-sans);\n  font-size: 14px;\n  line-height: 1.5;\n  color: var(--color-fg-default);\n  background-color: var(--color-canvas-default);\n  -webkit-font-smoothing: antialiased;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n}\n\n/* Header bar */\n.gh-header {\n  background-color: var(--color-canvas-subtle);\n  border-bottom: 1px solid var(--color-border-default);\n  padding: 12px 24px;\n}\n\n.gh-header-inner {\n  max-width: 1280px;\n  margin: 0 auto;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  flex-wrap: wrap;\n}\n\n.gh-brand {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  text-decoration: none;\n  color: var(--color-fg-default);\n  font-weight: 600;\n  font-size: 16px;\n}\n\n.gh-brand-icon {\n  display: flex;\n  align-items: center;\n  color: var(--color-fg-default);\n}\n\n.gh-repo-title {\n  color: var(--color-accent-fg);\n  font-weight: 600;\n}\n\n.gh-header-actions {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n/* GitHub Buttons & Selectors */\n.gh-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 4px 10px;\n  font-size: 12px;\n  font-weight: 500;\n  line-height: 20px;\n  color: var(--color-fg-default);\n  background-color: var(--color-canvas-subtle);\n  border: 1px solid var(--color-border-default);\n  border-radius: var(--radius-md);\n  cursor: pointer;\n  text-decoration: none;\n  transition: 80ms cubic-bezier(0.33, 1, 0.68, 1);\n  box-shadow: var(--shadow-sm);\n  user-select: none;\n}\n\n.gh-btn:hover {\n  background-color: var(--color-border-muted);\n}\n\n.gh-btn:active {\n  background-color: var(--color-border-default);\n}\n\n.gh-btn:focus-visible {\n  outline: 2px solid var(--color-accent-fg);\n  outline-offset: -1px;\n}\n\n.gh-btn-primary {\n  color: #ffffff;\n  background-color: var(--color-success-emphasis);\n  border-color: rgba(27, 31, 36, 0.15);\n}\n\n.gh-btn-primary:hover {\n  background-color: #2c974b;\n}\n\n/* Ref (Branch/Tag) Selector Popover */\n.ref-selector-wrap {\n  position: relative;\n}\n\n.ref-selector-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  cursor: pointer;\n}\n\n.ref-btn-label {\n  font-weight: 600;\n  max-width: 140px;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.dropdown-caret {\n  font-size: 11px;\n  margin-left: 2px;\n  color: var(--color-fg-muted);\n}\n\n.ref-popover {\n  position: absolute;\n  top: calc(100% + 4px);\n  left: 0;\n  width: 300px;\n  background-color: var(--color-canvas-default);\n  border: 1px solid var(--color-border-default);\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow-rest);\n  z-index: 100;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n}\n\n.ref-popover-header {\n  padding: 8px 10px;\n  background-color: var(--color-canvas-subtle);\n  border-bottom: 1px solid var(--color-border-default);\n}\n\n.ref-popover-top {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 8px;\n}\n\n.ref-popover-title {\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--color-fg-default);\n}\n\n.ref-popover-close {\n  background: none;\n  border: none;\n  cursor: pointer;\n  padding: 2px 6px;\n  font-size: 13px;\n  color: var(--color-fg-muted);\n  border-radius: var(--radius-sm);\n}\n\n.ref-popover-close:hover {\n  color: var(--color-fg-default);\n  background-color: var(--color-neutral-subtle);\n}\n\n.ref-search-wrap {\n  margin-bottom: 8px;\n}\n\n.ref-search-input {\n  width: 100%;\n  padding: 5px 8px;\n  font-size: 12px;\n  color: var(--color-fg-default);\n  background-color: var(--color-canvas-default);\n  border: 1px solid var(--color-border-default);\n  border-radius: var(--radius-sm);\n  outline: none;\n}\n\n.ref-search-input::placeholder {\n  color: var(--color-fg-muted);\n  opacity: 1;\n}\n\n.ref-search-input:focus {\n  border-color: var(--color-accent-fg);\n  box-shadow: 0 0 0 2px var(--color-accent-subtle);\n}\n\n.ref-tabs {\n  display: flex;\n  gap: 4px;\n  border-bottom: 1px solid var(--color-border-muted);\n  margin-top: 4px;\n}\n\n.ref-tab {\n  background: none;\n  border: none;\n  border-bottom: 2px solid transparent;\n  padding: 4px 8px;\n  font-size: 12px;\n  color: var(--color-fg-muted);\n  cursor: pointer;\n  margin-bottom: -1px;\n}\n\n.ref-tab:hover {\n  color: var(--color-fg-default);\n}\n\n.ref-tab.active {\n  color: var(--color-fg-default);\n  border-bottom-color: #fd8c73;\n  font-weight: 600;\n}\n\n.ref-list {\n  max-height: 250px;\n  overflow-y: auto;\n  padding: 4px 0;\n}\n\n.ref-item {\n  display: flex;\n  align-items: center;\n  padding: 6px 12px;\n  font-size: 12px;\n  color: var(--color-fg-default);\n  cursor: pointer;\n  gap: 8px;\n  text-decoration: none;\n}\n\n.ref-item:hover, .ref-item.active {\n  background-color: var(--color-canvas-subtle);\n}\n\n.ref-item.selected {\n  font-weight: 600;\n}\n\n.ref-item-check {\n  width: 16px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--color-fg-default);\n  flex-shrink: 0;\n}\n\n.ref-item-name {\n  flex: 1;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.ref-item-badge {\n  font-size: 11px;\n  font-weight: 600;\n  padding: 1px 5px;\n  border-radius: 10px;\n  margin-left: auto;\n}\n\n.ref-empty {\n  padding: 16px 12px;\n  text-align: center;\n  color: var(--color-fg-muted);\n  font-size: 12px;\n}\n\n/* Tabs */\n.gh-nav-tabs {\n  background-color: var(--color-canvas-subtle);\n  border-bottom: 1px solid var(--color-border-default);\n  padding: 0 24px;\n}\n\n.gh-nav-tabs-inner {\n  max-width: 1280px;\n  margin: 0 auto;\n  display: flex;\n  gap: 8px;\n  overflow-x: auto;\n}\n\n.gh-tab {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 8px 12px;\n  font-size: 14px;\n  font-weight: 500;\n  color: var(--color-fg-muted);\n  text-decoration: none;\n  border-bottom: 2px solid transparent;\n  cursor: pointer;\n  white-space: nowrap;\n}\n\n.gh-tab:hover {\n  color: var(--color-fg-default);\n}\n\n.gh-tab.active {\n  color: var(--color-fg-default);\n  font-weight: 600;\n  border-bottom-color: #fd8c73;\n}\n\n.gh-tab .counter {\n  display: inline-block;\n  padding: 0 6px;\n  font-size: 12px;\n  font-weight: 500;\n  line-height: 18px;\n  color: var(--color-fg-default);\n  background-color: var(--color-neutral-subtle);\n  border-radius: 20px;\n}\n\n/* Main Container */\n.gh-container {\n  max-width: 1280px;\n  width: 100%;\n  margin: 0 auto;\n  padding: 24px;\n  flex: 1;\n}\n\n/* Metric Cards */\n.metrics-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n  margin-bottom: 20px;\n}\n\n.metric-card {\n  background-color: var(--color-canvas-default);\n  border: 1px solid var(--color-border-default);\n  border-radius: var(--radius-md);\n  padding: 16px;\n  box-shadow: var(--shadow-sm);\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n}\n\n.metric-title {\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--color-fg-muted);\n  text-transform: uppercase;\n  letter-spacing: 0.5px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 8px;\n}\n\n.metric-value-row {\n  display: flex;\n  align-items: baseline;\n  gap: 8px;\n  margin-bottom: 8px;\n}\n\n.metric-percent {\n  font-size: 28px;\n  font-weight: 600;\n  line-height: 1.1;\n  font-family: var(--font-sans);\n}\n\n.metric-counts {\n  font-size: 13px;\n  color: var(--color-fg-muted);\n}\n\n/* Progress bar */\n.progress-bar-container {\n  height: 6px;\n  background-color: var(--color-border-muted);\n  border-radius: 3px;\n  overflow: hidden;\n  margin-top: 6px;\n}\n\n.progress-bar-fill {\n  height: 100%;\n  border-radius: 3px;\n}\n\n/* Delta badges */\n.delta-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 2px;\n  padding: 2px 6px;\n  font-size: 11px;\n  font-weight: 600;\n  border-radius: 12px;\n  line-height: 14px;\n}\n\n.delta-badge.positive {\n  color: var(--color-success-fg);\n  background-color: var(--color-success-subtle);\n}\n\n.delta-badge.negative {\n  color: var(--color-danger-fg);\n  background-color: var(--color-danger-subtle);\n}\n\n.delta-badge.neutral {\n  color: var(--color-fg-muted);\n  background-color: var(--color-neutral-subtle);\n}\n\n/* GitHub Commit Banner */\n.commit-banner {\n  background-color: var(--color-canvas-subtle);\n  border: 1px solid var(--color-border-default);\n  border-radius: var(--radius-md);\n  padding: 12px 16px;\n  margin-bottom: 20px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  flex-wrap: wrap;\n  gap: 12px;\n}\n\n.commit-left {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  flex-wrap: wrap;\n}\n\n.commit-author-avatar {\n  width: 24px;\n  height: 24px;\n  border-radius: 50%;\n  background-color: var(--color-accent-emphasis);\n  color: #ffffff;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 11px;\n  font-weight: 600;\n}\n\n.commit-message {\n  font-weight: 600;\n  color: var(--color-fg-default);\n}\n\n.commit-meta {\n  color: var(--color-fg-muted);\n  font-size: 12px;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.commit-sha-badge {\n  font-family: var(--font-mono);\n  font-size: 12px;\n  background-color: var(--color-neutral-subtle);\n  padding: 2px 6px;\n  border-radius: var(--radius-sm);\n  color: var(--color-accent-fg);\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n}\n\n/* Toolbar & Breadcrumbs */\n.file-toolbar {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 12px;\n  flex-wrap: wrap;\n  gap: 12px;\n}\n\n.breadcrumbs {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 14px;\n  color: var(--color-fg-muted);\n  flex-wrap: wrap;\n}\n\n.breadcrumb-item {\n  color: var(--color-accent-fg);\n  text-decoration: none;\n  font-weight: 500;\n  cursor: pointer;\n}\n\n.breadcrumb-item:hover {\n  text-decoration: underline;\n}\n\n.breadcrumb-separator {\n  color: var(--color-fg-muted);\n}\n\n.search-box {\n  position: relative;\n  min-width: 220px;\n}\n\n.search-box input {\n  width: 100%;\n  padding: 5px 10px 5px 30px;\n  font-size: 13px;\n  color: var(--color-fg-default);\n  background-color: var(--color-canvas-default);\n  border: 1px solid var(--color-border-default);\n  border-radius: var(--radius-md);\n  outline: none;\n}\n\n.search-box input::placeholder {\n  color: var(--color-fg-muted);\n  opacity: 1;\n}\n\n.search-box input:focus {\n  border-color: var(--color-accent-fg);\n  box-shadow: 0 0 0 3px var(--color-accent-subtle);\n}\n\n.search-icon {\n  position: absolute;\n  left: 8px;\n  top: 50%;\n  transform: translateY(-50%);\n  color: var(--color-fg-muted);\n  display: flex;\n  align-items: center;\n  pointer-events: none;\n  z-index: 1;\n}\n\n/* File Table */\n.gh-box {\n  background-color: var(--color-canvas-default);\n  border: 1px solid var(--color-border-default);\n  border-radius: var(--radius-md);\n  overflow: hidden;\n  margin-bottom: 24px;\n}\n\n.table-wrapper {\n  overflow-x: auto;\n  max-inline-size: 100%;\n}\n\ntable.gh-table {\n  width: 100%;\n  border-collapse: collapse;\n  text-align: left;\n  font-size: 13px;\n}\n\ntable.gh-table th {\n  background-color: var(--color-canvas-subtle);\n  color: var(--color-fg-muted);\n  font-weight: 600;\n  padding:  .form-label {\n      display: block;\n      font-size: 13px;\n      font-weight: 600;\n      margin-bottom: 6px;\n    }\n    .form-input, .form-select {\n      width: 100%;\n      padding: 8px 12px;\n      font-size: 14px;\n      font-family: var(--font-stack);\n      border: 1px solid var(--color-border-default);\n      border-radius: 6px;\n      background: var(--color-canvas-default);\n      color: var(--color-fg-default);\n    }\n    .badge-preview-box {\n      margin-top: 24px;\n      padding: 20px;\n      background: var(--color-canvas-default);\n      border: 1px solid var(--color-border-default);\n      border-radius: 6px;\n      display: flex;\n      flex-direction: column;\n      gap: 16px;\n      align-items: center;\n    }\n    .badge-img-wrap {\n      padding: 12px;\n    }\n    .code-preview {\n      width: 100%;\n      background: var(--color-canvas-subtle);\n      border: 1px solid var(--color-border-muted);\n      border-radius: 6px;\n      padding: 12px;\n      font-family: var(--font-mono);\n      font-size: 12px;\n      overflow-x: auto;\n      white-space: pre-wrap;\n      word-break: break-all;\n    }\n\n    /* Benchmarks Table */\n    .benchmarks-table-wrap {\n      overflow-x: auto;\n      border: 1px solid var(--color-border-default);\n      border-radius: 8px;\n      padding: 16px;\n      background-color: var(--color-canvas-subtle);\n    }\n    .benchmarks-table {\n      width: 100%;\n      border-collapse: separate;\n      border-spacing: 0;\n      background-color: var(--color-canvas-default);\n      border: 1px solid var(--color-border-muted);\n      border-radius: 6px;\n      overflow: hidden;\n      text-align: left;\n      font-size: 13px;\n    }\n    .benchmarks-table th, .benchmarks-table td {\n      padding: 12px 18px;\n      border-bottom: 1px solid var(--color-border-muted);\n    }\n    .benchmarks-table th {\n      background: var(--color-canvas-subtle);\n      font-weight: 600;\n    }\n    .benchmarks-table tr:last-child td {\n      border-bottom: none;\n    }\n    .highlight-cell {\n      color: var(--color-success-fg);\n      font-weight: 600;\n    }\n\n    /* Code Tabs */\n    .code-tabs {\n      border: 1px solid var(--color-border-default);\n      border-radius: 8px;\n      overflow: hidden;\n      max-width: 800px;\n      margin: 0 auto;\n    }\n    .tabs-header {\n      display: flex;\n      background: var(--color-canvas-subtle);\n      border-bottom: 1px solid var(--color-border-default);\n      overflow-x: auto;\n    }\n    .tab-btn {\n      padding: 10px 16px;\n      font-size: 13px;\n      font-weight: 600;\n      color: var(--color-fg-muted);\n      background: none;\n      border: none;\n      cursor: pointer;\n      border-bottom: 2px solid transparent;\n    }\n    .tab-btn.active {\n      color: var(--color-fg-default);\n      border-bottom-color: var(--color-accent-emphasis);\n      background: var(--color-canvas-default);\n    }\n    .tab-content {\n      padding: 20px;\n      background: var(--color-canvas-default);\n      font-family: var(--font-mono);\n      font-size: 13px;\n      line-height: 1.6;\n      overflow-x: auto;\n      white-space: pre;\n    }\n\n    /* Toast */\n    .toast {\n      position: fixed;\n      bottom: 24px;\n      right: 24px;\n      background: #1f2328;\n      color: #ffffff;\n      padding: 10px 18px;\n      border-radius: 6px;\n      font-size: 13px;\n      font-weight: 500;\n      display: none;\n      z-index: 1000;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.2);\n    }\n    [data-color-mode=\"dark\"] .toast {\n      background: #30363d;\n      color: #f0f6fc;\n    }\n\n    /* Footer */\n    .site-footer {\n      padding: 48px 0;\n      text-align: center;\n      color: var(--color-fg-muted);\n      font-size: 13px;\n    }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003c!-- Header --\u003e\n  \u003cheader class=\"site-header\"\u003e\n    \u003ca href=\"#\" class=\"brand\"\u003e\n      \u003csvg height=\"24\" viewBox=\"
